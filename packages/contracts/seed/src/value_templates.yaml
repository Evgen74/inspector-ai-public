# «Инспектор ИИ» — value templates for pd_value / rd_value / id_value (submission) and the ПД/РД/ИД cells of
# Приложение 2 sections 4–5 (93 §3.5, §5.4). Owner: AG-03. Built into value_templates.json by build_seed.py; the
# renderer is inspector_common.params (format_value, stage_values, protocol_cell).
#
# Order of use (params.stage_values):
#   1. the change-map route of the element family (change_matrix_map.json value_templates: gold phrasing, e.g.
#      «Конфигурация вентиляции по листу {pd_sheet} ПД» / «Конфигурация вентиляции изменена»);
#   2. otherwise the generic template of the comparison result below, with the element noun from the lexicon;
#   3. a stage that is not part of the check gives null (gold style, 97 §2.5).
# Placeholders: {pd_value} {rd_value} {id_value} (values already formatted by format_value), {Element} (noun,
# capitalised), {element_gen} (genitive after «Конфигурация»), {pd_sheet}, {rd_plan_mark}, {location};
# {~<predicate>} agrees with the noun (predicates below).
# Keep «ё» as printed in the gold («Тёплый пол»).

number_format:
  decimal_separator: ','
  group_thousands: false          # «1560 м³» (Приложение 2); no separators keep numeric parsing trivial
  dimension_separator: '×'        # «4×95 мм²», «500×300»
  unit_separator: ' '             # «1,0 м», «850 м²»
  percent: '{value}%'             # «16%» (Приложение 2: no space before %)
  per_mille: '{value} ‰'

# Display form of units: raw spelling → canonical (normalize_regex_input already maps м2/м3).
units:
  м2: м²
  м3: м³
  мм2: мм²
  см2: см²
  кв.м: м²
  кв. м: м²
  куб.м: м³
  куб. м: м³
  шт: шт.
  дн: дн.
  сут: сут.
  мес: мес.
  тыс.руб: тыс. руб.
  млн.руб: млн руб.

# Class and mark values: pattern (Python re, full match on the stripped value) → format. Приложение 2 prints the
# concrete class with a Latin B («B35») and the fire-resistance limit with a hyphen («EI-60»); the submission and
# the protocol cells follow that sample. Normative texts keep their own notation («EI 60»). A «В25» token is
# formatted as a concrete class only with kind CONCRETE_CLASS (it may be a ventilation or water system tag).
class_formats:
  - {kind: CONCRETE_CLASS, pattern: '[BВвb]\s*(\d{1,3}(?:[.,]\d)?)', format: 'B{1}', requires_kind: true}
  - {kind: FIRE_RESISTANCE, pattern: '(REI|EIW|EIS|EI|RE|R|E)\s*-?\s*(\d{2,3})', format: '{1}-{2}'}
  - {kind: FROST_RESISTANCE, pattern: '[FfФ]\s*(\d{2,4})', format: 'F{1}'}
  - {kind: WATER_TIGHTNESS, pattern: '[WwВв]\s*(\d{1,2})', format: 'W{1}', requires_kind: true}
  - {kind: MATERIAL_FIRE_CLASS, pattern: '(КМ|KM)\s*(\d)', format: 'КМ{2}'}

cells:
  not_applicable: '—'    # the stage is not part of the check (Приложение 2 «—»)
  missing: 'нет данных'  # the stage is part of the check but the value was not extracted

# Agreement of a predicate with the noun: m | f | n | pl.
predicates:
  предусмотрен: {m: предусмотрен, f: предусмотрена, n: предусмотрено, pl: предусмотрены}
  отсутствует: {m: отсутствует, f: отсутствует, n: отсутствует, pl: отсутствуют}
  изменён: {m: изменён, f: изменена, n: изменено, pl: изменены}

# Generic templates per ComparisonResult (93 §3.5). null = no text value (the stage slot stays null).
by_comparison_result:
  MISSING_DESIGN_ELEMENT:
    PD: '{Element} {~предусмотрен}'
    RD: '{Element} {~отсутствует}'
    ID: '{Element} {~отсутствует}'
  EXTRA_ELEMENT:
    PD: '{Element} не {~предусмотрен}'
    RD: '{Element} {~предусмотрен}'
    ID: '{Element} {~предусмотрен}'
  CONFIGURATION_MISMATCH:
    PD: 'Конфигурация {element_gen} по листу {pd_sheet} ПД'
    RD: 'Конфигурация {element_gen} изменена'
    ID: 'Конфигурация {element_gen} изменена'
  VALUE_MISMATCH: {PD: '{pd_value}', RD: '{rd_value}', ID: '{id_value}'}
  MATERIAL_SUBSTITUTION: {PD: '{pd_value}', RD: '{rd_value}', ID: '{id_value}'}
  TOLERANCE_EXCEEDED: {PD: '{pd_value}', RD: '{rd_value}', ID: '{id_value}'}

# Applied (in order) when a placeholder has no value, before the renderer drops what is left.
fallbacks:
  - {placeholder: pd_sheet, find: ' по листу {pd_sheet} ПД', replace: ' по ПД'}
  - {placeholder: rd_plan_mark, find: ' на плане {rd_plan_mark},', replace: ' в РД,'}
  - {placeholder: location, find: ', помещение {location}', replace: ''}

