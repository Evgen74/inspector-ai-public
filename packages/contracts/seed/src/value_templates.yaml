# Agreement fallback for a noun outside the lexicon (e.g. a FREE element noun). The first matching rule wins;
# `first` is the ending of the first word, `last` (optional) the endings allowed for the last word.
agreement_by_ending:
  - {first: ые, agr: pl}
  - {first: ие, last: [ы, и], agr: pl}
  - {first: ия, agr: f}
  - {first: ая, agr: f}
  - {first: яя, agr: f}
  - {first: ое, agr: n}
  - {first: ее, agr: n}
  - {first: ие, agr: n}
  - {first: ый, agr: m}
  - {first: ий, agr: m}
  - {first: ой, agr: m}
  - {first: а, agr: f}
  - {first: я, agr: f}
  - {first: о, agr: n}
  - {first: е, agr: n}
  - {first: ы, agr: pl}
  - {first: и, agr: pl}
