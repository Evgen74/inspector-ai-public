# «Инспектор ИИ» — hardened extraction regexes for the 132 parameters (source of params.json: regex_* fields).
# Owner: AG-03. Built by build_seed.py. Every pattern:
#   - is Python `re` (3.12), applied to text normalised by inspector_common.params.normalize_regex_input;
#   - passes inspector_common.params.regex_safety_problems (no nested/adjacent ambiguous quantifiers, no
#     leading unbounded quantifier); regex_pattern ≤ 255 chars (ТЗ §8.1 VARCHAR(255)), aux ≤ 512;
#   - runs only through compile_guarded (windows ≤ 20 000 chars, per-window time budget);
#   - has positive and negative examples, checked by the tests through ParamRegistry.extract (gates applied).
# Named groups: the primary value is the first non-empty of v, v2, v3; other groups are attributes.
# Russian word suffixes use [а-яё] (letters only), never \w: \w also matches digits and made «слово12345»
# ambiguous with the number that follows (quadratic backtracking), see seed/README.md.
# Example keys: text, discipline (optional hint for gates), v (expected primary value), groups (expected subset).
#
# YAML: patterns are single-quoted, so backslashes are literal and a quote is written ''.

gates:
  - id: CONCRETE_CLASS
    description: >-
      «В25»/«B25» — класс бетона, если рядом признаки бетона/конструкций (бетон, БСТ, F/W, КЖ, плита, колонна…)
      или дисциплина КР/КЖ; отклоняется в контексте вентиляции (система В20, L=…м³/ч, воздуховод, ОВ).
    window_chars: 60
    accept_if_groups: [v2]
    require_any:
      - '(?i)бетон|(?<![а-яё])бст(?![а-яё])|ж/?б(?![а-яё])|монолит|морозост|водонепроницаем|прочност|фундамент|перекрыт|ростверк|пилон|колонн|ригел|балк'
      - '(?<![A-Za-zА-Яа-я])[FW]\s?\d{1,3}(?!\d)|(?<![А-ЯA-Z])КЖ|(?i:(?<![а-яё])(?:сва[яийюе]|плит[аыуе]|стен[аыуе]))'
    reject_any:
      - '(?i)вентиляц|вытяжн|приточн|воздух|м[³3]/ч|(?<![a-z])l\s*=|вентилятор|клапан|дымоудал|подпор|кондиц|отсос'
      - '(?<![А-ЯA-Z])(?:ВЕ\d|[ПВB]\d{1,2}\.\d|ОВ\d?(?![а-яё]))|(?i:систем[а-яё]*+\s+[вп]\d)'
    accept_disciplines: [КР, КЖ, КЖД, КЖИ, КЖ0, КМ, АС, СВГ, ФП]
    reject_disciplines: [ОВ, ОВИК, ИОС4, ВК, ИОС2, ИОС3, ЭОМ, ИОС1]
    default: reject

  - id: VENT_SYSTEM_TAG
    description: >-
      «В20»/«П1.1» — обозначение системы вентиляции, если рядом вентиляционный контекст или дисциплина ОВ;
      отклоняется рядом с признаками бетона (класс, F/W, БСТ, КЖ).
    window_chars: 60
    require_any:
      - '(?i)вентиляц|вытяжн|приточн|воздух|м[³3]/ч|(?<![a-z])l\s*=|вентилятор|клапан|дымоудал|отсос|венткамер|диффузор|решетк'
      - '(?<![А-ЯA-Z])(?:ВЕ\d|[ПВB]\d{1,2}\.\d|ОВ\d?(?![а-яё]))|(?i:систем[а-яё]*+\s+[вп]\d)'
    reject_any:
      - '(?i)бетон|(?<![а-яё])бст(?![а-яё])|монолит|морозост|водонепроницаем|класс[а-яё]*+\s+(?:бетона|прочности)|арматур'
      - '(?<![A-Za-zА-Яа-я])[FW]\s?\d{1,3}(?!\d)|(?<![А-ЯA-Z])КЖ'
    accept_disciplines: [ОВ, ОВИК, ИОС4]
    reject_disciplines: [КР, КЖ, КЖД, КЖИ, КЖ0, СВГ]
    default: reject

  - id: VENT_DUCT
    description: >-
      Размер «400х200»/«Ø250» — сечение воздуховода, если перед ним метка системы (В2.4, П1) или вентиляционный
      контекст; отклоняется для колонн, окон, дверей и проёмов.
    window_chars: 60
    accept_if_groups: [sys]
    require_any:
      - '(?i)воздуховод|вентиляц|вытяжн|приточн|м[³3]/ч|(?<![a-z])l\s*=|отсос|решетк|диффузор|клапан|венткамер'
    reject_any:
      - '(?i)колонн|пилон|окон|оконн|двер|про[её]м|витраж|балк|ригел|плит[аыуе]|бетон|арматур'
    accept_disciplines: [ОВ, ОВИК, ИОС4]
    reject_disciplines: [КР, КЖ, АР]
    default: reject

  - id: KM_FIRE_CLASS
    description: >-
      «КМ1» — класс пожарной опасности материала, а не марка «КМ» (конструкции металлические) в шифре или
      наименовании комплекта.
    window_chars: 40
    require_any:
      - '(?i)класс|пожарн|отделк|материал|горюч|облицов|покрыти|декларац|эвакуац'
      - '(?<![А-ЯA-Z])(?:Г[1-4]|Д[1-3]|Т[1-4]|РП[1-4])(?!\d)|(?<![А-ЯA-Z])НГ(?![а-яё])'
    reject_any:
      - '(?i)(?<![а-яё])кмд|(?:марк|комплект|раздел|лист|чертеж|чертёж|шифр)[а-яё]*+\s+км|металлическ|стальн[а-яё]++\s+конструкц'
    default: reject

  - id: STAIR
    description: «150х300» — подступенок × проступь только в контексте лестниц (иначе это сечение, проём и т.п.).
    window_chars: 60
    accept_if_groups: [n]
    require_any:
      - '(?i)лестн|марш|ступен|подступен|проступ'
    default: reject

  - id: ROOF_LAYER
    description: >-
      Строка «слой — толщина мм» относится к составу кровли/покрытия только рядом со словами сборки (кровля, пирог,
      пароизоляция, мембрана, утеплитель, стяжка…); иначе это любая строка, оканчивающаяся числом.
    window_chars: 300
    require_any:
      - '(?i)кровл|покрыти|пирог|мембран|пароизоляц|гидроизоляц|утеплит|теплоизоляц|стяжк|разуклон|уклонообразующ|керамзит|слой|кровельн'
    default: reject

  - id: STRUCTURAL_SECTION
    description: >-
      «500х600» — сечение колонны/пилона, если есть марка (К1, Пн-3) или конструктивный контекст; отклоняется
      для окон, дверей, проёмов и воздуховодов.
    window_chars: 60
    accept_if_groups: [mark]
    require_any:
      - '(?i)колонн|пилон|сечени|железобетон|монолитн'
      - '(?<![А-ЯA-Z])КЖ'
    reject_any:
      - '(?i)окон|оконн|двер|про[её]м|воздуховод|вентиляц|решетк|витраж'
    accept_disciplines: [КР, КЖ]
    default: reject

  - id: WATER_SYSTEM_TAG
    description: «В1/Т3/Т4» — водопровод (В1 хоз.-питьевой, Т3/Т4 ГВС), а не система вентиляции В1 или группа горючести.
    window_chars: 60
    require_any:
      - '(?i)водопровод|водоснаб|стояк|трубопровод|(?<![а-яё])ду(?![а-яё])|(?<![a-z])dn|хоз|питьев|санитар|полипропилен|оцинк|гвс|хвс'
      - '(?<![А-ЯA-Z])ВК(?![а-яё])'
    reject_any:
      - '(?i)вентиляц|вытяжн|приточн|воздух|м[³3]/ч|вентилятор|горюч|воспламен'
      - '(?<![А-ЯA-Z])(?:Г[1-4]|КМ\d)(?!\d)'
    accept_disciplines: [ВК, ИОС2, НВК]
    reject_disciplines: [ОВ, ОВИК, ИОС4]
    default: reject

  - id: SEWER_SYSTEM_TAG
    description: «К1/К2/К3» — канализация/водосток, а не марка колонны К1.
    window_chars: 60
    require_any:
      - '(?i)канализ|выпуск|стояк|трубопровод|(?<![а-яё])ду(?![а-яё])|(?<![a-z])dn|водосток|сток|пвх|чугун'
      - '(?<![А-ЯA-Z])ВК(?![а-яё])'
    reject_any:
      - '(?i)колонн|пилон|сечени|армир|бетон|монолит'
      - '(?<![А-ЯA-Z])КЖ'
    accept_disciplines: [ВК, ИОС3, НВК]
    reject_disciplines: [КР, КЖ]
    default: reject

  - id: HEATING_SYSTEM_TAG
    description: «Т1/Т2» — трубопроводы отопления/теплоснабжения, а не класс токсичности Т1…Т4.
    window_chars: 60
    require_any:
      - '(?i)отоплен|теплоснаб|теплосет|трубопровод|стояк|магистрал|(?<![а-яё])ду(?![а-яё])|(?<![a-z])dn|подающ|обратн'
      - '(?<![А-ЯA-Z])(?:ИТП|ОВ)(?![а-яё])'
    reject_any:
      - '(?i)токсичн|горюч|воспламен|дымообраз'
      - '(?<![А-ЯA-Z])(?:Г[1-4]|КМ\d|РП\d)(?!\d)'
    accept_disciplines: [ОВ, ОВИК, ИОС4, ТС, НТС]
    default: reject

  - id: ID_AS_SOURCE_DATA
    description: «ИД» = «исходные данные» (раздел ПД «П-ИД», исходно-разрешительная документация), а не стадия ИД.
    window_chars: 40
    require_any:
      - '(?i)(?<![а-яё])п-?ид(?![а-яё])|исходн[а-яё]*+\s+данн|ид\s*\(\s*исходн|(?<![а-яё])ирд(?![а-яё])|исходно-разрешительн'
    reject_any:
      - '(?i)исполнительн|(?<![а-яё])аоср(?![а-яё])|освидетельствован|реестр[а-яё]*+\s+ид'
    default: reject

  - id: ID_AS_BUILT
    description: «ИД» = исполнительная документация (стадия ИД), а не «исходные данные».
    window_chars: 40
    require_any:
      - '(?i)исполнительн|(?<![а-яё])аоср(?![а-яё])|освидетельствован|реестр|скрыт[а-яё]++\s+работ|(?<![а-яё])акт[а-яё]*+|журнал|сертификат|паспорт'
      - '(?<![А-ЯA-Z])(?:ПД|РД)(?![А-ЯA-Zа-яё])'
    reject_any:
      - '(?i)исходн[а-яё]*+\s+данн|(?<![а-яё])п-ид(?![а-яё])|(?<![а-яё])ирд(?![а-яё])'
    default: reject

params:
  PZ-001:
    regex: '(?i)площадь\s+застройки[^\d\n]{0,60}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м²|м2|кв\.?\s?м)'
    aux:
      - '(?i)площадь\s+застройки[ \t,]*(?:м²|м2|кв\.?\s?м)[^\d\n]{0,20}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)'
    pos:
      - {text: 'Площадь застройки — 1 225,8 м²', v: '1 225,8'}
      - {text: 'Площадь застройки 767,0* м²', v: '767,0'}
      - {text: 'Площадь застройки, м² 1225,8', v: '1225,8'}
    neg:
      - 'Площадь застройки определяется по приложению А СП 54.13330'
      - 'Площадь участка 5 000 м²'

  PZ-002:
    regex: '(?i)общая\s+площадь(?!\s+(?:квартир|жил|нежил|помещени))(?:\s+здания|\s+объекта)?[^\d\n]{0,60}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м²|м2|кв\.?\s?м)'
    aux:
      - '(?i)(?:общий\s+)?итог[а-яё]*+\s+(?:общая\s+площадь\s+)?(?:по\s+)?этаж[а-яё]*+[^\d\n]{0,20}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\s*(?:м²|м2|кв\.?\s?м)'
      - '(?i)общая\s+площадь(?:\s+здания)?[ \t,]*(?:м²|м2|кв\.?\s?м)[^\d\n]{0,20}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)'
    pos:
      - {text: 'Общая площадь здания — 6 252,3 м²', v: '6 252,3'}
      - {text: 'Итого по этажу: 2797,27 м²', v: '2797,27'}
      - {text: 'Общая площадь здания, м² 6252,3', v: '6252,3'}
    neg:
      - 'Общая площадь квартир 4 120,5 м²'
      - 'Общая площадь здания определена по СП 118'

  PZ-003:
    regex: '(?i)(?:полезная|расч[её]тная)\s+площадь[^\d\n]{0,60}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м²|м2|кв\.?\s?м)'
    aux:
      - '(?m)^[ \t]*(?P<room>-?\d{1,4}(?:[.,]\d{1,3}){0,2}[а-яa-z]?|[А-ЯA-Z]\d{0,3})[ \t]+(?P<name>[А-ЯЁа-яё][^\d\n]{1,60}?)[ \t]+(?P<area>\d{1,5}[.,]\d{1,2})(?:[ \t]*м²)?[ \t]*$'
    pos:
      - {text: 'Расчётная площадь — 4 812,6 м²', v: '4 812,6'}
      - {text: '012 Венткамера 25,40 м²', groups: {room: '012', name: 'Венткамера', area: '25,40'}}
      - {text: '1.109 Зона ожидания 18,2', groups: {room: '1.109', area: '18,2'}}
    neg:
      - 'Полезная площадь не указана'
      - 'Итого по этажу 2797,27'

  PZ-004:
    regex: '(?i)строительный\s+об[ъь][её]м(?![^\d\n]{0,40}?(?:подземн|надземн))(?:\s*,)?(?:\s*(?:всего|общий|здания))?[^\d\n]{0,50}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м³|м3|куб\.?\s?м)'
    pos:
      - {text: 'Строительный объём, всего — 45 120 м³', v: '45 120'}
      - {text: 'Строительный объем здания 12500 м3', v: '12500'}
    neg:
      - 'Строительный объём подземной части 5 000 м³'
      - 'Строительный объём не изменился'

  PZ-005:
    regex: '(?i)об[ъь][её]м[^\n]{0,40}подземн[а-яё]*+[^\d\n]{0,40}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м³|м3)'
    pos:
      - {text: 'Строительный объём подземной части — 5 000 м³', v: '5 000'}
    neg:
      - 'Строительный объём надземной части 40 120 м³'
      - 'Объём подземной части не определён'

  PZ-006:
    regex: '(?i)об[ъь][её]м[^\n]{0,40}надземн[а-яё]*+[^\d\n]{0,40}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\*?\s*(?:м³|м3)'
    pos:
      - {text: 'Строительный объём надземной части — 40 120 м³', v: '40 120'}
    neg:
      - 'Строительный объём подземной части 5 000 м³'

  PZ-007:
    regex: '(?i)(?:этажност[а-яё]*+|количеств[а-яё]++\s+(?:надземных\s+)?этажей)[^\d\n]{0,40}?(?P<v>\d{1,3})(?!\d)'
    aux:
      - '(?i)(?<!\d)(?P<v>\d{1,3})[ \t]*(?:(?:надземных|жилых)[ \t]+этаж(?:ей|а)|этажей)(?![а-яё])'
    pos:
      - {text: 'Этажность — 17', v: '17'}
      - {text: 'Количество надземных этажей: 9', v: '9'}
      - {text: 'здание на 17 надземных этажей', v: '17'}
      - {text: 'секция в 25 этажей', v: '25'}
    neg:
      - 'Этажность здания переменная'
      - 'перекрытие 1 этажа в осях 1-5'

  PZ-008:
    regex: '(?i)высота\s+здания[^\d\n]{0,40}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\s*м(?![а-яё²³])'
    aux:
      - '(?i)отм\.?(?:\s*(?:верха|парапета|кровли))?\s*(?P<v>[+]?\d{1,3}[.,]\d{3})(?!\d)'
    pos:
      - {text: 'Высота здания — 58,5 м', v: '58,5'}
      - {text: 'Отм. верха +58,500', v: '+58,500'}
    neg:
      - 'Высота здания принята по ГПЗУ'

  PZ-009:
    regex: '(?i)(?:отметк[а-яё]++\s+)?(?<![\d.,])[±+]?0[.,]000\s*+(?:соответствует|=|принят[а-яё]*+)?[^\d\n]{0,40}?(?P<v>\d{2,3}[.,]\d{1,3})(?!\d)'
    pos:
      - {text: 'Отметка 0.000 соответствует абсолютной отметке 159,95', v: '159,95'}
      - {text: '±0,000 = 134,50', v: '134,50'}
    neg:
      - 'отметка 10.000 соответствует 150,00'
      - 'Отметка 0.000 принята по АР'

  PZ-010:
    regex: '(?i)(?:количеств[а-яё]++|число)\s+квартир[^\d\n]{0,30}?(?P<v>\d{1,5})(?!\d)'
    pos:
      - {text: 'Количество квартир — 240 шт.', v: '240'}
    neg:
      - 'Количество квартир не изменилось'

  PZ-011:
    regex: '(?i)(?P<type>студи[яи]|однокомнатн[а-яё]*+|двухкомнатн[а-яё]*+|тр[её]хкомнатн[а-яё]*+|четыр[её]хкомнатн[а-яё]*+|(?<!\d)[1-5]\s?-?\s?к(?:омн)?\.?)[^\d\n]{0,30}?(?P<v>\d{1,4})\s*(?:шт|кв)'
    aux:
      - '(?<![\d.,])(?P<t>\d{2,3}[.,]\d{2})\s*/\s*(?P<l>\d{2,3}[.,]\d{2})\s*/\s*(?P<s>\d{2,3}[.,]\d{2})(?!\d)'
    pos:
      - {text: 'Однокомнатные — 96 шт.', v: '96', groups: {type: 'Однокомнатные'}}
      - {text: '2-к. квартиры 48 шт', v: '48'}
      - {text: '21,34 / 31,31 / 34,06', groups: {t: '21,34', l: '31,31', s: '34,06'}}
    neg:
      - 'Студия площадью 25,4 м²'

  PZ-012:
    regex: '(?i)(?:(?<!\d)(?P<v>\d{1,5})\s*машино-?мест|машино-?мест[а-яё]*+[^\d\n]{0,30}?(?P<v2>\d{1,5})(?!\d))'
    pos:
      - {text: 'подземная автостоянка на 120 машино-мест', v: '120'}
      - {text: 'Машино-мест в подземной автостоянке: 85', v: '85'}
    neg:
      - 'машино-места для МГН предусмотрены'

  PZ-013:
    regex: '(?i)(?:(?<![а-яё])на|вместимост[а-яё]*+|мощност[а-яё]*+)\s*(?P<v>\d{1,6})\s*(?:мест|учащихся|детей|посещений|коек|т/год|шт/год)'
    pos:
      - {text: 'Детский сад на 220 мест', v: '220'}
      - {text: 'Вместимость 825 учащихся', v: '825'}
    neg:
      - 'стена 250 мм'
      - 'Она 25 мест не содержит'

  PZ-014:
    regex: '(?i)(?:(?<![а-яёa-z])[РP]\s?р\s*=|расч[её]тная\s+(?:электрическая\s+)?(?:мощность|нагрузка))[^\d\n]{0,30}?(?P<v>\d+(?: \d{3})*(?:[.,]\d+)?)\s*кВт'
    pos:
      - {text: 'Расчётная электрическая мощность — 1 250 кВт', v: '1 250'}
      - {text: 'Рр = 845,5 кВт', v: '845,5'}
    neg:
      - 'Расчётная мощность трансформатора 1000 кВА'

  PZ-015:
    regex: '(?i)(?P<v>(?<![\w])(?:I{1,3}|[1-3])|особ[а-яё]++\s+групп[а-яё]++\s+I)\s*(?:-?й\s*)?категори[а-яё]++\s+(?:по\s+)?(?:над[её]жности|электроснабжения)'
    pos:
      - {text: 'II категория по надежности электроснабжения', v: 'II'}
      - {text: 'электроприёмники 1-й категории надёжности', v: '1'}
