# «Инспектор ИИ» — change_matrix_map: element family × discrepancy type → parameter code (97 §2.10, 93 §3.8).
# Owner: AG-03. Consumers: AG-04 (comparators/exporter), AG-07 (FREE-* path). Built into change_matrix_map.json.
#
# Policy («learned from T», i.e. from the organizers' train gold on OBJ-TYUMENSKAYA-5-GOLD-SEED):
# - A change is reported under the closest matrix parameter OF THE SAME ENGINEERING SYSTEM whose element family
#   it touches, even when the trigger wording differs → PROVISIONAL_DOMAIN_MAPPING (gold: ventilation → IOS4-078/079).
# - A family no matrix parameter of its system covers is a matrix gap → FREE-<TOPIC> + MATRIX_GAP_CONFIRMED
#   (gold: warm floors → FREE-HEATING-001). NNN is numbered per finding group at export (FreeTopic vocabulary).
# - Directional triggers are enforced: a change in the non-violating direction does not emit (emit: false).
# - Additions and relocations are context, not findings (emit: false); ИД≠РД only in the violating direction.
# - Top-2 hedging uses hedge_codes (from params.json hedge_groups) when the runner-up has p ≥ 0.1 (97 §1.6).
#
# Route fields: discrepancy_types (enums.DiscrepancyType, each mapped to ONE comparison_result via
# enums.yaml mappings.discrepancy_to_comparison_result), parameter_code (catalog code | FREE-<TOPIC> | null),
# parameter_mapping_status, emit, sub_check (the DSL sub-check that evaluates it), hedge_codes,
# value_templates {pd, rd, id} mirroring the gold phrasing (93 §3.5), basis:
#   GOLD:<group>   — organizer train gold;  MATRIX — the catalog trigger names this element/change literally;
#   ANALOGY        — the 97 §2.10 rule applied to a family not seen in gold (provisional, review);
#   USER:Q4x       — user decision on 97 Q4 (КР routing); CONTEXT — non-emitting by policy.
# Placeholders in value_templates: {pd_value} {rd_value} {id_value} {pd_sheet} {rd_plan_mark} {location}.

schema_version: 1
policy:
  max_free_groups_per_object: 5
  hedge_min_runner_up_p: 0.1
  hedge_budget_share_of_critical: 0.2

families:
  # ─────────────────────────────── ИОС4: вентиляция (gold: G-TR-001, G-TR-003, G-TR-004) ───────────────────────────────
  - family: VENT_SUPPLY_UNIT
    label_ru: Приточные установки общеобменной вентиляции
    section: ИОС4
    disciplines: [ОВ]
    topic: VENTILATION
    tag_patterns: ['^П\d{1,2}(?:\.\d{1,2})?$']
    anchors: [приточная установка, вентагрегат, венткамера, приточная система]
    routes:
      - discrepancy_types: [CONFIGURATION_CHANGED, FUNCTION_CHANGED]
        parameter_code: IOS4-079
        parameter_mapping_status: PROVISIONAL_DOMAIN_MAPPING
        comparison_result: CONFIGURATION_MISMATCH
        emit: true
        sub_check: IOS4-079.b
        hedge_codes: [IOS4-078]
        basis: GOLD:G-TR-001
        value_templates: {pd: 'Конфигурация приточных установок по листу {pd_sheet} ПД', rd: 'Иная конфигурация на плане {rd_plan_mark}, помещение {location}', id: null}
      - discrepancy_types: [ELEMENT_MISSING]
        parameter_code: IOS4-079
        parameter_mapping_status: PROVISIONAL_DOMAIN_MAPPING
        comparison_result: MISSING_DESIGN_ELEMENT
        emit: true
        sub_check: IOS4-079.b
        hedge_codes: [IOS4-078]
        basis: ANALOGY
        value_templates: {pd: 'Приточная установка предусмотрена', rd: 'Приточная установка отсутствует', id: null}
      - discrepancy_types: [VALUE_DECREASED]
        parameter_code: IOS4-079
        parameter_mapping_status: SOURCE_MATRIX
        comparison_result: VALUE_MISMATCH
        emit: true
        sub_check: IOS4-079.a
        basis: MATRIX
        value_templates: {pd: '{pd_value}', rd: '{rd_value}', id: '{id_value}'}
      - discrepancy_types: [VALUE_INCREASED]
        parameter_code: IOS4-079
        parameter_mapping_status: SOURCE_MATRIX
        comparison_result: VALUE_MISMATCH
        emit: false
        basis: CONTEXT
        reason: направленный триггер «подмена на аналоги с меньшей кратностью»; рост производительности не нарушение
      - discrepancy_types: [ELEMENT_ADDED]
        parameter_code: null
        comparison_result: EXTRA_ELEMENT
        emit: false
        basis: CONTEXT
        reason: добавления — контекст, не нарушение (97 §2.10)

