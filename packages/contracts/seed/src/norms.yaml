# Template patches: additions on top of the staging templates.
template_patches:
  AR-051:
    edition_rules_add: [{pd_approved_before: '2026-01-26', norm_ref: 'СП 367.1325800.2017'}]
    reason: 'норма в norm_fill (СП 367.1325800.2025) введена 26.01.2026; для ранее утверждённой ПД — СП 367.1325800.2017'

# FREE topics: the staging vocabulary ends with GENERIC; the contract enum FreeTopic calls it OTHER.
free_topic_map: {GENERIC: OTHER}

# ── Vocabularies of recommendation_templates.json ──────────────────────────────────────────────────────────────────
# DeviationKind (proposed to AG-00): the kind of deviation that selects the «Отклонение» phrase and the «Вид
# нарушения» variant. staging_key is the key used by the staging templates; direction is the default
# DeviationDirection (AG-04 enum) — the renderer takes the actual direction from the phrase's marker.
deviation_kinds:
  - {code: DECREASE, staging_key: decrease, label_ru: Уменьшение, direction: DECREASE}
  - {code: INCREASE, staging_key: increase, label_ru: Увеличение, direction: INCREASE}
  - {code: CLASS_DOWNGRADE, staging_key: class_downgrade, label_ru: Понижение класса, direction: DECREASE}
  - {code: ABSENCE, staging_key: absence, label_ru: Отсутствие, direction: ABSENT}
  - {code: SUBSTITUTION, staging_key: substitution, label_ru: Замена, direction: CHANGED}
  - {code: CONFIGURATION_CHANGE, staging_key: configuration_change, label_ru: Изменение конфигурации, direction: CHANGED}
  - {code: NORM_VIOLATION, staging_key: norm_violation, label_ru: Несоответствие норме, direction: DECREASE}
  - {code: TOLERANCE_EXCEEDED, staging_key: tolerance_exceeded, label_ru: Отклонение сверх допуска, direction: DECREASE}
  - {code: ZONE_INTRUSION, staging_key: zone_intrusion, label_ru: Нарушение границ зоны, direction: ABSENT}

# BY_SIGN: the numbers decide (actual below ПД → DECREASE, above → INCREASE; unknown → DECREASE).
discrepancy_to_deviation_kind:
  VALUE_DECREASED: DECREASE
  VALUE_INCREASED: INCREASE
  VALUE_CHANGED: BY_SIGN
  THRESHOLD_BELOW_MIN: NORM_VIOLATION
  THRESHOLD_ABOVE_MAX: NORM_VIOLATION
  TOLERANCE_EXCEEDED: TOLERANCE_EXCEEDED
  CLASS_DOWNGRADED: CLASS_DOWNGRADE
  MATERIAL_SUBSTITUTED: SUBSTITUTION
  ELEMENT_MISSING: ABSENCE
  ELEMENT_ADDED: CONFIGURATION_CHANGE
  FUNCTION_CHANGED: CONFIGURATION_CHANGE
  LAYER_REMOVED: ABSENCE
  LAYER_CHANGED: CONFIGURATION_CHANGE
  POSITION_SHIFTED: CONFIGURATION_CHANGE
  CONFIGURATION_CHANGED: CONFIGURATION_CHANGE
  COUNT_CHANGED: BY_SIGN
  TOTAL_CHANGED: BY_SIGN
  UNDOCUMENTED_WORK: ABSENCE
comparison_result_to_deviation_kind:
  CONFIGURATION_MISMATCH: CONFIGURATION_CHANGE
  MISSING_DESIGN_ELEMENT: ABSENCE
  VALUE_MISMATCH: BY_SIGN
  MATERIAL_SUBSTITUTION: SUBSTITUTION
  EXTRA_ELEMENT: CONFIGURATION_CHANGE
  TOLERANCE_EXCEEDED: TOLERANCE_EXCEEDED
violation_type_to_deviation_kind:
  NUMERIC_DECREASE: DECREASE
  COUNT_DECREASE: DECREASE
  NUMERIC_DEVIATION: BY_SIGN
  NUMERIC_INCREASE: INCREASE
  CLASS_DOWNGRADE: CLASS_DOWNGRADE
  ELEMENT_REMOVED: ABSENCE
  MATERIAL_SUBSTITUTION: SUBSTITUTION
  CONFIG_CHANGE: CONFIGURATION_CHANGE
  LAYER_CHANGE: CONFIGURATION_CHANGE
  GEOMETRY_OFFSET: CONFIGURATION_CHANGE
  NORM_BOUND_VIOLATION: NORM_VIOLATION
  RATIO_VIOLATION: NORM_VIOLATION
  TOLERANCE_EXCEEDED: TOLERANCE_EXCEEDED
  ZONE_INTRUSION: ZONE_INTRUSION
  EXTERNAL_NONCOMPLIANCE: ABSENCE
  INTERNAL_INCONSISTENCY: CONFIGURATION_CHANGE
# «Отклонение» marker → DeviationDirection (AG-04 enum, Приложение 2 emoji; 🔄 is our addition, 93 §5.4).
markers: {'⬇️': DECREASE, '⬆️': INCREASE, '❌': ABSENT, '🔄': CHANGED}
# Delta format codes (staging lower case → seed code).
delta_formats: {abs: ABS, pct: PCT, count: COUNT, none: NONE}
# Verification status of a template's norm reference (staging wording → NormRefStatus).
template_ref_status_map:
  CONFIRMED: CONFIRMED
  CORRECTED: CORRECTED
  'OUTDATED_IN_MATRIX; REPLACEMENT_CITED': OUTDATED
  ADDITIONAL_VERIFIED: ADDED
  'NOT_FOUND_FOR_MATRIX_CLAIM; CLAUSE_QUOTED': CORRECTED

# Conventions printed into recommendation_templates.json (the renderer is inspector_common.params).
template_conventions:
  codes: 'template_id и code — канонический код каталога (KR-055); в «(…)» Раздела 7 печатается код каталога (для FREE — номер группы, FREE-HEATING-001). Код «AR-14» Приложения 2 ошибочен: это AR-040.'
  protocol_rows:
    section_4_5_parameter: '«{short_name} ({code})» плюс «, пом. …» для находок по помещениям (93 §5.4)'
    section_4_5_deviation: 'deviation_phrases[вид] (иначе фраза вида по умолчанию) с подстановкой {delta}; направление — по маркеру'
    section_7_1: 'Вид работ = «{work_type} ({code})»; Конкретная рекомендация = recommendation (recommendation_variants[вид] при наличии)'
    section_7_2: 'Вид нарушения = «{violation_kind_variants[вид:элемент] | violation_kind_variants[вид] | violation_kind} ({code})»; Конкретная рекомендация — как в 7.1'
    choice_7_1_vs_7_2: 'по criticality_level (protocol_section); FREE — всегда 7.2'
    preliminary_prefix: 'Проект рекомендации (до подтверждения инспектором): '
  placeholders:
    pd_value: 'значение ПД в формате подачи («1,0 м», «4×95 мм²», «B35», «EI-60»)'
    rd_value: 'значение РД'
    id_value: 'значение ИД'
    actual_value: 'отклоняющееся значение: id_value, если ИД представлена и расходится с ПД/РД, иначе rd_value'
    delta: 'величина отклонения по delta_format шаблона'
    location: 'место в читаемой форме: «пом. 012», «пом. 140, 142»; иное — по грамматике 93 §2.7; OBJECT не печатается'
    norm_value: 'нормативное требование с оператором и единицей («не менее 0,9 м в свету»): из нормативной проверки находки, иначе edition_rules по дате утверждения ПД, иначе norm_fill'
    norm_ref: 'обозначение и пункт нормы: из нормативной проверки, иначе edition_rules, иначе norm_fill'
    element: 'только FREE: наименование элемента со строчной буквы («тёплый пол»)'
  rendering_rules:
    - 'R1. Плейсхолдеры, кроме {delta}, {element}, {norm_value}, {norm_ref}, стоят в скобках; части скобочной группы разделяются «; ».'
    - 'R2. Если значение недоступно, удаляется часть группы, содержащая его; опустевшая группа удаляется вместе с пробелом перед ней.'
    - 'R3. Недоступный плейсхолдер вне скобок удаляется вместе с предшествующим «на », «: », « — », «, » или пробелом.'
    - 'R4. norm_value/norm_ref: значение нормативной проверки, иначе правило редакции для ПД, утверждённой до pd_approved_before, иначе norm_fill.'
    - 'R5. Числа — с десятичной запятой; «%» в {delta} без пробела («16%»), в нормативном тексте — с пробелом («1,5 %», «80 ‰»).'
    - 'R6. Если {delta} формата COUNT имеет форму one (1, 21, …), «Отсутствуют» перед ней заменяется на «Отсутствует».'
    - 'R7. После «на» форма one берётся из count_noun.one_acc («на 1 квартиру»).'
    - 'R8. К «Вид работ» (7.1) и «Вид нарушения» (7.2) добавляется « ({code})».'
    - 'R9. Цитаты норм, заменённых после даты утверждения ПД (реестр documents, inline_replace), переписываются на прежнюю редакцию без номеров пунктов.'
  delta_formats:
    ABS: '|ПД − факт| в единицах параметра с точностью исходных значений («0,3 м»)'
    PCT: '|Δ| / ПД × 100, один знак после запятой (округление половины вверх) без «,0» («7,7%», «12,5%»). Образец Приложения 2 печатает 15,9 и 28,9 как «16%» и «29%» — непоследовательно с «7,7%» и «12,5%»; правило одно.'
    COUNT: 'целое число + count_noun по правилу русского счёта («2 узла»)'
    NONE: 'величина не выводится («⬇️ Понижение класса», «⬇️ Занижение сечения»)'
  variant_keys: 'violation_kind_variants / recommendation_variants / deviation_phrases — по кодам DeviationKind; ключ «DECREASE:бетон» — вариант по элементу (element_key).'
  norm_policy: 'Числа в текстах — только из верифицированных записей с уверенностью HIGH (проверяется при сборке и тестом). Ссылки MEDIUM приводятся без чисел. Пороги Заказчика (CUSTOMER_THRESHOLD), значения NO_BASIS_FOUND и LOW в рекомендации не выносятся. Для заменённых документов цитируется действующая редакция, прежняя — через edition_rules и реестр documents по дате утверждения ПД.'
  status: 'DRAFT — эталонные шаблоны резолютивной части; до экспертной проверки (U-18) печатаются с префиксом «Проект рекомендации (до подтверждения инспектором): ».'
