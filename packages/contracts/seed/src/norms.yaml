# «Инспектор ИИ» — AG-03 curation of the web-verified normative references (M1). Built into params.json
# (`references`, `norm_verification`, thresholds) and recommendation_templates.json by build_seed.py.
#
# Inputs adopted verbatim from docs/analysis/norms_staging (review phase, checked 2026-09-27) into src/norms/:
#   norms_pz_spzu_ar_kr_pos_pod.json        ← norms_ПЗ_СПЗУ_АР_КР_ПОС_ПОД_M_001_M_067_M_081_M_097_.json
#   norms_ios_oos_ppm_odi_zu_sm.json         ← norms_ИОС1_5_ООС_ППМ_ОДИ_ЗУ_СМ_M_068_M_080_M_098_M_132_.json
#   recommendation_templates.staging.json   ← recommendation_templates.json
# The copies are never edited: every AG-03 decision lives in this file (and in texts.yaml / rules.yaml /
# regexes.yaml), and the build records the sha256 of every input in `sources`.
#
# Policies (documented in seed/README.md):
# - A reference keeps its verification status (NormRefStatus). NOT_FOUND references are never cited: they are kept
#   in norm_verification.references_not_found. Additional references found by the verifier enter as ADDED.
# - Numbers in recommendation texts come only from HIGH-confidence verified records (test-enforced).
# - Edition choice (90 C-50/CON-40): design norms by the PD approval date (fallback: the check date); process and
#   as-built norms (ИГД, отходы) by the date of the event (act, trip). A document replaced after the PD approval
#   date is cited in its previous edition; inline citations of a replaced design norm are rewritten to the previous
#   designation without clause numbers (clause numbering differs between editions).
# - Thresholds: the matrix literal is the customer's detection trigger (Приложение 1). It is overridden only when
#   the verified norm shows it is wrong in a way that matters (D-04: 1,5 м for МГН doors flags nearly every door),
#   or when the norm is unconditional and stricter and the literal is an evident error (ODI-121 3,5 → 3,6 м). A
#   softer or conditional literal stays as the trigger; the verified norm and its conditions are recorded in
#   norm_verification.threshold and cited by the recommendations.

checked_at: '2026-09-27'

inputs:
  - {file: norms/norms_pz_spzu_ar_kr_pos_pod.json, staging: docs/analysis/norms_staging/norms_ПЗ_СПЗУ_АР_КР_ПОС_ПОД_M_001_M_067_M_081_M_097_.json}
  - {file: norms/norms_ios_oos_ppm_odi_zu_sm.json, staging: docs/analysis/norms_staging/norms_ИОС1_5_ООС_ППМ_ОДИ_ЗУ_СМ_M_068_M_080_M_098_M_132_.json}
  - {file: norms/recommendation_templates.staging.json, staging: docs/analysis/norms_staging/recommendation_templates.json}

# NormRefStatus (proposed to AG-00 for enums.yaml): verification status of one normative reference.
reference_status:
  CONFIRMED: 'документ действует, пункт и смысл подтверждены (при необходимости уточнён пункт)'
  CORRECTED: 'документ верный или близкий, но уточнены пункт, значение или обозначение'
  OUTDATED: 'в Матрице указана утратившая силу редакция; цитируется действующая замена'
  NOT_FOUND: 'в указанном документе требуемой нормы нет; ссылка не цитируется'
  ADDED: 'дополнительная ссылка, найденная при верификации'

# NormThresholdStatus (proposed to AG-00): verdict on the matrix threshold. The two staging files use two
# vocabularies; staging_map folds them into one.
threshold_status:
  vocabulary:
    CONFIRMED: 'числовой порог Матрицы совпадает с нормой'
    CORRECTED: 'норма задаёт иной порог или условие'
    CONDITIONAL: 'норма зависит от условия (высота, класс Ф, путь МГН и т. п.)'
    MATRIX_STRICTER_THAN_NORM: 'порог Матрицы строже нормы — сохраняется как порог Заказчика'
    CUSTOMER_THRESHOLD: 'порог — решение Заказчика (Матрицы), нормой не установлен'
    RULE_BASED: 'нечисловое правило (статус во внешней системе, наличие документа)'
    NOT_NORMATIVE: 'межстадийная сверка ПД↔РД↔ИД без нормативного числа'
    OBJECT_SPECIFIC: 'предел берётся из объектных документов (ГПЗУ, ТУ, ПД, РНГП)'
    NO_BASIS_FOUND: 'нормативного основания для порога Матрицы не найдено'
  staging_map:
    CONFIRMED: CONFIRMED
    CORRECTED: CORRECTED
    CONDITIONAL: CONDITIONAL
    MATRIX_STRICTER_THAN_NORM: MATRIX_STRICTER_THAN_NORM
    MATRIX_DEFINED: CUSTOMER_THRESHOLD
    CUSTOMER_THRESHOLD: CUSTOMER_THRESHOLD
    RULE_BASED: RULE_BASED
    NO_NORMATIVE_THRESHOLD: NOT_NORMATIVE
    NOT_NORMATIVE: NOT_NORMATIVE
    OBJECT_SPECIFIC: OBJECT_SPECIFIC
    NO_BASIS_FOUND: NO_BASIS_FOUND

