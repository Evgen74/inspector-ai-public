# Threshold decisions (see the policy above). Each one changes params.json and is logged in seed_changes.
threshold_decisions:
  ODI-121:
    min_value: 3.6
    threshold_source: NORMATIVE_OVERRIDE
    matrix_trigger_value: {min: 3.5}
    threshold_note: 'Ширина специализированного места для кресла-коляски не менее 3,6 м при длине 6,0 м (6,8 м вдоль проезжей части) — СП 59.13330.2020, п. 5.2.4 (HIGH). Порог Матрицы 3,5 м мягче нормы (D-06), сохранён в matrix_trigger_value.'
    sub_notes: {ODI-121.b: 'Норма СП 59.13330.2020, п. 5.2.4: ширина не менее 3,6 м (порог Матрицы 3,5 м — ошибка, D-06).'}
    sub_titles: {ODI-121.b: 'Ширина места для инвалида на кресле-коляске ниже нормы'}
    reason: 'верификация норм (HIGH): СП 59.13330.2020 п. 5.2.4 — 6,0 × 3,6 м; литерал Матрицы 3,5 м ошибочен'
  ODI-119:
    min_value: 1.7
    threshold_source: NORMATIVE_OVERRIDE
    matrix_trigger_value: {min: 1.5}
    conditional: {ODI-119.a: [{if: {var: object.is_reconstruction}, min: 1.5}]}
    threshold_note: 'Универсальная кабина (новое строительство): меньший размер в плане не менее 1,7 м (1,7 × 2,2 м; при центральном унитазе 2,2 × 2,25 м) — СП 59.13330.2020, п. 6.3.7, табл. 6.1 (HIGH); 1,5 × 1,5 м — только при реконструкции. Порог Матрицы 1,5 м сохранён в matrix_trigger_value.'
    sub_notes: {ODI-119.a: 'Новое строительство — не менее 1,7 м (СП 59.13330.2020, табл. 6.1); реконструкция (object.is_reconstruction) — 1,5 м.'}
    reason: 'верификация норм (HIGH): СП 59.13330.2020 табл. 6.1 — 1,7 × 2,2 м для нового строительства; 1,5 м — только реконструкция'
  PPM-104:
    conditional: {PPM-104.a: [{if: {'==': [{var: element.evac_people_gt_threshold}, false]}, min: 1.0}]}
    threshold_note: 'Не менее 1,2 м при числе эвакуирующихся по участку более 50 человек; 1,0 м — в остальных случаях; 0,7 м — проходы к одиночным рабочим местам; высота не менее 2,0 м — СП 1.13130.2020, пп. 4.3.2, 4.3.3 (HIGH). Без сведений о численности — 1,2 м.'
    sub_notes: {PPM-104.a: '1,2 м — более 50 эвакуирующихся по участку, иначе 1,0 м (СП 1.13130.2020, п. 4.3.3; прежняя ссылка п. 4.3.4 исправлена).'}
    sub_titles: {PPM-104.a: 'Ширина эвакуационного прохода ниже нормы'}
    reason: 'верификация норм (HIGH): СП 1.13130.2020 п. 4.3.3 — 1,2 м при > 50 чел., иначе 1,0 м (как AR-040)'
  ODI-117:
    threshold_note: 'Ширина дверных проёмов в свету на путях МГН не менее 0,9 м (при реконструкции в несущих конструкциях — 0,8 м; при глубине откоса более 1,0 м — 1,2 м) — СП 59.13330.2020, пп. 6.1.5, 6.2.4 (HIGH). Литерал Матрицы 1,5 м нормой не подтверждается (D-04 закрыт верификацией), сохранён в matrix_trigger_value.'
    sub_notes: {ODI-117.a: 'Норма 0,9 м в свету (СП 59.13330.2020, пп. 6.1.5, 6.2.4, HIGH); литерал Матрицы 1,5 м не подтверждён (D-04 закрыт).'}
    reason: 'D-04 закрыт верификацией норм (HIGH): СП 59.13330.2020 пп. 6.1.5, 6.2.4 — 0,9 м'
  ODI-116:
    threshold_note: 'Порог Матрицы 1,5 м (1,8 м при встречном движении) — логика СП 59.13330.2016, сохранён как триггер Заказчика. Действующая норма: не менее 1,8 м; 1,2–1,5 м допускается при карманах для разъезда (длина не менее 2 м, общая ширина не менее 1,8 м) — СП 59.13330.2020, п. 6.2.1 (HIGH).'
    sub_notes: {ODI-116.a: 'Триггер Матрицы 1,5/1,8 м; норма СП 59.13330.2020 п. 6.2.1 — 1,8 м или 1,2–1,5 м с карманами (карманы не извлекаются — порог Матрицы сохранён).'}
    reason: 'верификация норм: литерал Матрицы мягче нормы и условен (карманы не извлекаются) — сохранён, норма записана'
  SPZU-030:
    threshold_note: 'Ширина проездов по пожарно-технической высоте: 3,5 м (до 13 м), 4,2 м (13–46 м), 6,0 м (более 46 м) — СП 4.13130.2013, п. 8.1.4 (нумерация после Изм. № 3; прежний п. 8.6), HIGH. Без высоты — 4,2 м.'
    sub_notes: {SPZU-030.a: 'Порог по высоте — СП 4.13130.2013, п. 8.1.4 (прежний п. 8.6), HIGH. Без высоты — 4,2 м.'}
    reason: 'верификация норм: пункт п. 8.6 → п. 8.1.4 (Изм. № 3), значения подтверждены (HIGH)'
  AR-040:
    threshold_note: '1,2 м — более 50 эвакуирующихся, иначе 1,0 м (СП 1.13130.2020, п. 4.3.3, HIGH); в жилых зданиях Ф1.3 — 1,4 м при длине коридора до 40 м и 1,6 м при большей длине (п. 6.1.9).'
    sub_notes: {AR-040.a: '1,2 м — более 50 эвакуирующихся, иначе 1,0 м (СП 1.13130.2020, п. 4.3.3, HIGH; прежняя ссылка п. 4.3.4 исправлена). Ф1.3 — 1,4/1,6 м (п. 6.1.9).'}
    reason: 'верификация норм: п. 4.3.4 → п. 4.3.3; добавлено условие Ф1.3 (п. 6.1.9)'
  PPM-105:
    threshold_note: 'Порог Матрицы 0,9 м строже нормы и сохранён как порог Заказчика; нормативный минимум — 0,8 м, при 50 и более эвакуирующихся — 1,2 м, для выходов из лестничных клеток — не менее ширины марша (СП 1.13130.2020, пп. 4.2.19, 4.2.20, HIGH).'
    reason: 'верификация норм: MATRIX_STRICTER_THAN_NORM — порог Заказчика сохранён'
  SPZU-033:
    threshold_note: 'Пороги Матрицей не заданы. Для ПД, утверждённой с 12.07.2026: наибольший продольный уклон проездов 80 ‰ (СП 42.13330.2026, табл. 8.9, HIGH); для ранее утверждённой ПД — по СП 42.13330.2016. Наименьший продольный уклон по лоткам — по СП 396.1325800.2018, п. 5.6.24 (MEDIUM). Значения задаёт администратор (Normative_Base).'
    reason: 'верификация норм: действующие значения по СП 42.13330.2026 записаны, выбор редакции — по дате утверждения ПД'

