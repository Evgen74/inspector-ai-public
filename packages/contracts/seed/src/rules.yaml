# «Инспектор ИИ» — comparison-rule DSL patches applied on top of docs/analysis/matrix_enriched.json (B03 DSL,
# 03 §3.4) when building params.json. Owner: AG-03. Every patch carries its reason; build_seed.py records them in
# params.json `seed_changes`.
#
# Derived for EVERY atomic rule (build_seed.py, documented in seed/README.md):
# - direction (97 §2.10 «directional triggers are enforced»): kept when set; otherwise ORDINAL_COMPARE/ENUM_CHANGE
#   with a vocabulary → DOWNGRADE (free_text → ANY); PRESENCE, LAYER_STACK, RATIO_BOUND → DECREASE;
#   NORMATIVE_BOUND → DECREASE for a min bound, INCREASE for a max bound, ANY for both/none;
#   SET_DIFF → DECREASE when only MISSING is detected, else ANY; the rest → ANY. Overrides below.
# - candidate_policy (90 C-56): TRIGGER for a numeric matrix trigger (REL_DELTA_GT, NORMATIVE_BOUND, RATIO_BOUND,
#   TOLERANCE_CHECK, GEOMETRY_OFFSET), DEVIATION otherwise (qualitative trigger: any adverse change beyond ε).
# - sub_id: «M-003.b» → «PZ-003.b» (catalog code is canonical, 97 §2.9).

moved_to_logical_rules:
  # 90 C-53: INTERNAL_CONSISTENCY sub-checks leave comparison_rule; B07/AG-07 Logical_Rules are the only producer
  # of SUSPICION. logical_rule refers to the 03 §3.9 seed (HR-LOG-005 Σ explication = total, HR-LOG-006 apartments).
  - {sub_id: PZ-002.b, logical_rule: HR-LOG-005, reason: 'Σ поэтажных итогов = общая площадь — внутренняя согласованность одной стадии (90 C-53)'}
  - {sub_id: PZ-003.c, logical_rule: HR-LOG-005, reason: 'Σ площадей помещений = «Итого по этажу» (90 C-53)'}
  - {sub_id: PZ-010.b, logical_rule: HR-LOG-006, reason: 'количество квартир = Σ квартирографии (90 C-53)'}
  - {sub_id: PZ-019.c, logical_rule: null, reason: 'КЗ = площадь застройки / площадь участка; правила в Logical_Rules ещё нет — AG-07 (90 C-53)'}

semantic_low_confidence:
  # 90 C-53: a SEMANTIC_DIFF below min_confidence ends as NOT_COMPARABLE (basis LOW_CONFIDENCE_SEMANTIC), not SUSPICION.
  low_confidence_status: NOT_COMPARABLE
  low_confidence_basis: LOW_CONFIDENCE_SEMANTIC
  reason: '90 C-53: SUSPICION выпускает только модуль гипотез (B07)'

direction_overrides:
  KR-054.b: {direction: ANY, reason: 'отклонения осей в ИД сверх допуска в любую сторону'}
  KR-058.b: {direction: DECREASE, reason: 'триггер «уменьшение толщины плиты … по факту заливки (ИД)»; утолщение не нарушение (97 Q4b)'}
  KR-059.b: {direction: DECREASE, reason: 'триггер «уменьшение толщины перекрытия»; утолщение не нарушение (97 Q4b)'}
  KR-060.b: {direction: DECREASE, reason: 'триггер «уменьшение площади поперечного сечения»'}
  KR-061.b: {direction: DECREASE, reason: 'триггер «уменьшение толщины стен»; смещение осей — KR-054'}
  SPZU-029.b: {direction: ANY, reason: '«подмена на аналоги» — качество аналога не автоматизируется, кандидат на любую замену'}
  KR-066.c: {direction: ANY, reason: 'замена состава — кандидат; снижение предела оценивает KR-066.a'}
  POD-091: {direction: ANY, reason: '«самовольное изменение метода» — любое изменение'}

set_diff_overrides:
  # 97 §2.10: additions and relocations are context, not findings → context_detect (collected, never emitted).
  PZ-003.b: {detect: [MISSING, CHANGED], context_detect: [ADDED], reason: 'добавленное помещение не «сокращение полезной площади» (97 §2.10)'}
  AR-052: {detect: [MISSING, CHANGED], context_detect: [ADDED], reason: 'добавления — контекст (97 §2.10)'}
  KR-054.a: {detect: [CHANGED, MISSING], context_detect: [ADDED], reason: 'добавленная ось — контекст; изменение шага фиксирует CHANGED (97 §2.10)'}
  IOS4-078.b:
    detect: [MISSING, CHANGED]
    context_detect: [ADDED]
    element_key: room_number
    compare_attributes: [branch_multiset]
    title: 'Вытяжная вентиляция помещения ПД отсутствует или её состав изменён в РД (мультимножество ветвей по помещению)'
    note: 'Ключ — номер помещения, а не метка ветви: РД перенумеровывает ветви (Тюменская, 95 §3.4). Помещение без вытяжки в РД → MISSING (MISSING_DESIGN_ELEMENT, G-TR-003); иной состав ветвей → CHANGED (CONFIGURATION_MISMATCH, G-TR-004); помещение, где вытяжка появилась только в РД → контекст.'
    reason: 'организаторская разметка G-TR-003/004 (97 §2.10, 95 §3.4)'
  IOS4-079.b:
    detect: [MISSING, CHANGED]
    context_detect: [ADDED]
    element_key: room_number
    compare_attributes: [unit_set]
    title: 'Состав или конфигурация установок в венткамере изменены относительно ПД (набор установок по помещению)'
    note: 'Ключ — номер помещения (венткамеры); сравнивается набор установок с учётом разделения/слияния (П17 → П17.1 + П17.2, G-TR-001).'
    reason: 'организаторская разметка G-TR-001 (97 §2.10)'
  POS-083.b: {detect: [MISSING, CHANGED], context_detect: [ADDED], reason: 'добавления — контекст (97 §2.10)'}
  POS-085.b: {detect: [MISSING], context_detect: [ADDED, CHANGED], reason: 'перенос площадок — контекст; размещение в опасной зоне оценивает POS-085.a (97 §2.10)'}
  POD-097.b: {detect: [MISSING], context_detect: [ADDED, CHANGED], reason: 'перенос площадок — контекст; размещение на бровке/над сетями оценивает POD-097.a (97 §2.10)'}

sub_check_patches:
  SPZU-035.a: {note: 'Без извлечённой геометрии → NOT_COMPARABLE (GEOMETRY_NOT_EXTRACTED); SUSPICION выпускает только модуль гипотез (90 C-53).', reason: '90 C-53'}
  IOS5-080.b: {note: 'Требует геометрии плана и параметров помещения (СП 484); без них → NOT_COMPARABLE (GEOMETRY_NOT_EXTRACTED) (90 C-53).', reason: '90 C-53'}
  POS-081.a: {note: 'Требует геометрии границы участка и зоны; без неё → NOT_COMPARABLE (GEOMETRY_NOT_EXTRACTED) (90 C-53).', reason: '90 C-53'}
  POS-087: {note: 'Классификатор методов (монолит/сборный ЖБ/сборно-монолитный/металлокаркас…) — enum; несовпадение класса → CANDIDATE; уверенность < 0,8 → NOT_COMPARABLE (LOW_CONFIDENCE_SEMANTIC) (90 C-53).', reason: '90 C-53'}
  PPM-111.c: {note: 'Требует геометрии воздуховодов и преград; без неё → NOT_COMPARABLE (GEOMETRY_NOT_EXTRACTED) (90 C-53).', reason: '90 C-53'}
  PPM-114.b: {note: 'Геометрия сети и контура здания; без неё → NOT_COMPARABLE (GEOMETRY_NOT_EXTRACTED) (90 C-53).', reason: '90 C-53'}
  IOS4-077.c:
    title: 'Отопительный прибор помещения ПД отсутствует в РД'
    note: 'Тёплые полы не относятся к IOS4-077: это пробел Матрицы, маршрут FREE-HEATING (change_matrix_map: WARM_FLOOR; организаторская разметка G-TR-002, 97 §2.10).'
    reason: 'маршрут тёплых полов — FREE-HEATING-001 (97 §2.10), ранее M-077.c'
  POD-091:
    note: 'Метод извлекается SEMANTIC-классификатором; уверенность < 0,8 → NOT_COMPARABLE (LOW_CONFIDENCE_SEMANTIC), не SUSPICION (90 C-53).'
    reason: '90 C-53'

anchor_removals:
  IOS4-077: {remove: [тёплый пол, контур тёплого пола], reason: 'тёплые полы → FREE-HEATING (change_matrix_map WARM_FLOOR), 97 §2.10'}

notes_append:
