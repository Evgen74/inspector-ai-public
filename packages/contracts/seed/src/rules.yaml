  IOS4-078: 'Маршрутизация организаторов: отсутствие/изменение вытяжной вентиляции помещений → IOS4-078 (PROVISIONAL_DOMAIN_MAPPING, G-TR-003/004); топ-2 хедж с IOS4-079.'
  IOS4-079: 'Маршрутизация организаторов: конфигурация приточных установок в венткамере → IOS4-079 (PROVISIONAL_DOMAIN_MAPPING, G-TR-001); топ-2 хедж с IOS4-078.'
  KR-055: 'Снижение марок F/W при неизменном классе B — не KR-055, а FREE-STRUCTURE (решение по вопросу 97 Q4a).'
