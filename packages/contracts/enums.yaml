# ───────────────────────────── Cross-enum mappings (data, not code) ─────────────────────────────
mappings:

  # 97 §2.7: DiscrepancyType (engine) → ComparisonResult (gold / submission). AG-04 ratifies the non-gold rows.
  discrepancy_to_comparison_result:
    VALUE_DECREASED: VALUE_MISMATCH
    VALUE_INCREASED: VALUE_MISMATCH
    VALUE_CHANGED: VALUE_MISMATCH
    THRESHOLD_BELOW_MIN: VALUE_MISMATCH
    THRESHOLD_ABOVE_MAX: VALUE_MISMATCH
    COUNT_CHANGED: VALUE_MISMATCH
    TOTAL_CHANGED: VALUE_MISMATCH
    TOLERANCE_EXCEEDED: TOLERANCE_EXCEEDED
    CLASS_DOWNGRADED: MATERIAL_SUBSTITUTION
    MATERIAL_SUBSTITUTED: MATERIAL_SUBSTITUTION
    ELEMENT_MISSING: MISSING_DESIGN_ELEMENT
    LAYER_REMOVED: MISSING_DESIGN_ELEMENT
    ELEMENT_ADDED: EXTRA_ELEMENT
    UNDOCUMENTED_WORK: EXTRA_ELEMENT
    FUNCTION_CHANGED: CONFIGURATION_MISMATCH
    CONFIGURATION_CHANGED: CONFIGURATION_MISMATCH
    LAYER_CHANGED: CONFIGURATION_MISMATCH
    POSITION_SHIFTED: CONFIGURATION_MISMATCH

  # 97 §2.6: which protocol_status is consistent with a violation_label (integrity rule R13, 93 §4.6).
  protocol_status_by_label:
    VIOLATION_PRESENT: [CRITICAL, WARNING]
    NO_VIOLATION: [OK]
    MISSING_DOCUMENT: [PD_MISSING, RD_MISSING, ID_MISSING]
    COMPARISON_IMPOSSIBLE: [COMPARISON_IMPOSSIBLE]

  # 97 §2.6: missing stage → protocol_status for MISSING_DOCUMENT; precedence RD > PD > ID when several.
  missing_stage_status:
    precedence: [RD, PD, ID]
    status: {PD: PD_MISSING, RD: RD_MISSING, ID: ID_MISSING}

  # 97 §2.5 / 93 §3.7: criticality string for FREE-* findings (protocol_status WARNING, never gated).
  free_search:
    criticality_string: "Существенное (предписание) — требует утверждения"
    protocol_status: WARNING
    criticality_level: SUBSTANTIAL_ORDER

  # 97 §2.6: internal statuses → (violation_label, protocol_status). Batch mode exports every CANDIDATE.
  status_mapping:
    - {when: {completeness_status: [COMPLETE], finding_status: [CANDIDATE, CONFIRMED_VIOLATION]}, violation_label: VIOLATION_PRESENT, protocol_status: "CRITICAL if CRITICAL_SUSPEND else WARNING"}
    - {when: {completeness_status: [COMPLETE], finding_status: [NEGATIVE_VERIFIED]}, violation_label: NO_VIOLATION, protocol_status: OK}
    - {when: {completeness_status: [NOT_APPLICABLE]}, violation_label: NO_VIOLATION, protocol_status: OK}
    - {when: {completeness_status: [MISSING_EVIDENCE], level: DOCUMENT}, violation_label: MISSING_DOCUMENT, protocol_status: "missing_stage_status"}
    - {when: {completeness_status: [MISSING_EVIDENCE], level: FRAGMENT}, violation_label: COMPARISON_IMPOSSIBLE, protocol_status: COMPARISON_IMPOSSIBLE}
    - {when: {completeness_status: [NOT_COMPARABLE, CLARIFICATION_REQUIRED]}, violation_label: COMPARISON_IMPOSSIBLE, protocol_status: COMPARISON_IMPOSSIBLE}
    - {when: {finding_status: [SUSPICION], evidence_bound: true}, violation_label: VIOLATION_PRESENT, protocol_status: WARNING, parameter_code: "FREE-*"}
    - {when: {finding_status: [SUSPICION], evidence_bound: false}, export: false}

  # 97 §2.6: per-parameter precedence over stage availability (first match wins).
  parameter_precedence:
    - "≤ 1 required stage available → COMPARISON_IMPOSSIBLE"
    - "a pairwise violation wins over a missing third stage → VIOLATION_PRESENT"
    - "a required stage missing → MISSING_DOCUMENT (RD > PD > ID)"
    - "otherwise → NO_VIOLATION"
