# «Инспектор ИИ» — canonical enum registry (single source of truth).
#
# Maintainer: AG-00. Semantics owner: the `owner` agent of each enum.
# Sources: docs/analysis/90 §3.2.1 (canonical registry) + 97 §2.6–§2.9 (overrides and additions)
#          + the organizers' package (submission_schema.json, document_manifest.jsonl, train gold).
#
# Rules
# - Values are UPPER_SNAKE, except DataType, ExportFormat and SubmissionVariant (lowercase by source).
# - A value is either a bare string or a mapping {code, label_ru?, description?, aliases?, ...attributes}.
# - `open: true`  → an externally owned vocabulary (organizer data). Loaders keep unknown values raw and warn;
#                   they never fail on them. Everything else is closed: an unknown value is a contract violation.
# - `status: proposed` → added by AG-00 from the reports but not yet ratified by the semantics owner.
# - Changing this file: edit it, run `make contracts` (regenerates schemas/enums.schema.json and the Python
#   StrEnums), commit both. CI (`make test`) fails on drift. Never add values in code.

schema_version: 1
contract_version: "0.1.0"

enums:

