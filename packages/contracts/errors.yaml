# «Инспектор ИИ» — error catalogue (RFC 9457 application/problem+json), seeded from docs/analysis/10 §3.2–§3.12.
#
# Maintainer: AG-00. Every error, warning and data-quality code used in code must be listed here.
# Envelope: schemas/problem.schema.json. Titles and details are Russian (user-facing); `{name}` placeholders
# are filled from `details` and must be declared in `details`.
#
# Required per entry: code, http (int, or null for non-HTTP codes), domain, severity, title_ru, detail_ru;
# hint_ru is required when severity = error. Everything else falls back to `defaults`.
# `status: proposed` marks codes added by AG-00 for plan v2 (batch mode, 97) that report 10 does not list.

schema_version: 1
contract_version: "0.1.0"

vocabularies:
  domain: [api, auth, security, intake, content, registry, revision, quality, processing, infra, comparison, verification, protocol, rin, normative, ml, client, batch]
  scope: [request, package, file, page, zone, registry_row, revision_group, param, job, sync, run, system]
  severity: [error, warning, info]
  log_level: [DEBUG, INFO, WARNING, ERROR]
  alert: [null, warning, critical]
  user_notification: [null, inline, feed]
  actions: [CREATE_SUCCESSOR, REUPLOAD, DOWNLOAD_REGISTRY_TEMPLATE, BUILD_REGISTRY_DRAFT, OPEN_BLOCKERS, CONFIRM_BELONGS, REMOVE_FROM_PACKAGE, RELOGIN, RETRY]

defaults:
  scope: request
  retryable: false
  security_event: false
  alert: null
  user_notification: null
  details: {}
  log_level_by_severity: {error: ERROR, warning: WARNING, info: INFO}

errors:

  # ── Generic API ──
  - code: VALIDATION_ERROR
    http: 400
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Некорректный запрос"
    detail_ru: "Запрос не прошёл проверку схемы: {summary}."
    hint_ru: "Исправьте поля, перечисленные в списке ошибок, и повторите запрос."
    details: {summary: string}
    tz_ref: "ТЗ §1.3 (обязательная валидация схемы)"
  - code: MALFORMED_JSON
    http: 400
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Некорректный JSON"
    detail_ru: "Тело запроса не является корректным JSON."
    hint_ru: "Проверьте формат тела запроса."
  - code: PAYLOAD_TOO_LARGE
    http: 413
    domain: api
    severity: error
    title_ru: "Слишком большой запрос"
    detail_ru: "Размер тела запроса превышает допустимый ({limit_bytes} байт)."
    hint_ru: "Уменьшите объём передаваемых данных."
    details: {limit_bytes: integer}
  - code: UNSUPPORTED_MEDIA_TYPE
    http: 415
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Неподдерживаемый тип содержимого"
    detail_ru: "Тип содержимого запроса «{content_type}» не поддерживается."
    hint_ru: "Передайте данные в формате application/json или multipart/form-data."
    details: {content_type: string}
  - code: NOT_FOUND
    http: 404
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Не найдено"
    detail_ru: "Запрошенный ресурс не найден."
    hint_ru: "Проверьте адрес и идентификатор."
  - code: PROCESS_NOT_FOUND
    http: 404
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Проверка не найдена"
    detail_ru: "Проверка не найдена или у вас нет к ней доступа."
    hint_ru: "Откройте проверку из списка объектов."
    scenarios: [NS-A23]
  - code: PROCESS_STATE_CONFLICT
    http: 409
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Действие недоступно"
    detail_ru: "Проверка сейчас в статусе «{status}»: это действие для неё недоступно."
    hint_ru: "Обновите страницу проверки: статус мог измениться."
    details: {status: string}
    scenarios: [NS-A23]
  - code: FILE_NOT_FOUND
    http: 404
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Файл не найден"
    detail_ru: "Файл {file_id} не найден или у вас нет к нему доступа."
    hint_ru: "Проверьте идентификатор файла."
    details: {file_id: string}
  - code: METHOD_NOT_ALLOWED
    http: 405
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Метод не поддерживается"
    detail_ru: "Метод {method} не поддерживается для этого ресурса."
    hint_ru: "Используйте метод, указанный в описании API."
    details: {method: string}
  - code: NOT_ACCEPTABLE
    http: 406
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Формат ответа недоступен"
    detail_ru: "Запрошенный формат ответа ({accept}) недоступен."
    hint_ru: "Запросите ответ в формате application/json."
    details: {accept: string}
  - code: REQUEST_TIMEOUT
    http: 408
    domain: api
    severity: error
    retryable: true
    title_ru: "Превышено время передачи"
    detail_ru: "Превышено время передачи файлов. Проверьте соединение и повторите загрузку."
    hint_ru: "Повторите загрузку при стабильном соединении."
    scenarios: [NS-A30]
  - code: PRECONDITION_REQUIRED
    http: 428
    domain: api
    severity: error
    log_level: INFO
    title_ru: "Требуется версия записи"
    detail_ru: "Обновите карточку и повторите действие."
    hint_ru: "Запрос на изменение должен содержать заголовок If-Match."
    scenarios: [NS-G06]
  - code: IDEMPOTENCY_KEY_REUSED
    http: 422
    domain: api
    severity: error
    title_ru: "Ключ идемпотентности уже использован"
    detail_ru: "Повторный запрос с тем же ключом содержит другие данные."
    hint_ru: "Для нового действия используйте новый Idempotency-Key."
    scenarios: [NS-G09]
  - code: RESULT_NOT_READY
    http: 409
    domain: api
    severity: error
    log_level: INFO
    retryable: true
    title_ru: "Результат ещё не готов"
    detail_ru: "Протокол ещё формируется (этап: {stage}, {pct} %). Повторите запрос позже."
    hint_ru: "Дождитесь завершения обработки; статус доступен в карточке проверки."
    details: {stage: string, pct: integer}
    scenarios: [NS-G19]
  - code: RATE_LIMITED
    http: 429
    domain: api
    severity: error
    retryable: true
    security_event: true
    title_ru: "Превышен лимит запросов"
    detail_ru: "Превышен лимит запросов ({limit} за {window}). Повторите через {retry_after_s} с."
    hint_ru: "Подождите указанное время и повторите действие."
    details: {limit: integer, window: string, retry_after_s: integer}
    scenarios: [NS-A29]
  - code: INTERNAL_ERROR
    http: 500
    domain: api
    severity: error
    retryable: true
    alert: warning
    title_ru: "Внутренняя ошибка"
    detail_ru: "Внутренняя ошибка сервиса. Код обращения: {request_id}."
    hint_ru: "Повторите попытку. Если ошибка повторяется, сообщите администратору код обращения."
    details: {request_id: string}
  - code: RESPONSE_SCHEMA_VIOLATION
    http: 500
    domain: api
    severity: error
    alert: warning
    title_ru: "Ответ не соответствует контракту"
    detail_ru: "Ответ сервиса не прошёл проверку схемы (код обращения {request_id})."
    hint_ru: "Сообщите администратору код обращения."
    details: {request_id: string}
  - code: SERVICE_UNAVAILABLE
    http: 503
    domain: infra
    severity: error
    retryable: true
    title_ru: "Сервис временно недоступен"
    detail_ru: "Сервис временно недоступен. Повторите попытку через {retry_after_s} с."
    hint_ru: "Повторите попытку позже."
    details: {retry_after_s: integer}
  - code: MAINTENANCE_MODE
    http: 503
    domain: infra
    severity: info
    retryable: true
    title_ru: "Технические работы"
    detail_ru: "Проводятся технические работы. Повторите попытку через {retry_after_s} с."
    details: {retry_after_s: integer}
  - code: UPSTREAM_BAD_RESPONSE
    http: 502
    domain: infra
    severity: error
    retryable: true
    title_ru: "Ошибка смежного сервиса"
    detail_ru: "Смежный сервис {service} вернул некорректный ответ."
    hint_ru: "Повторите попытку позже."
    details: {service: string}
  - code: UPSTREAM_TIMEOUT
    http: 504
    domain: infra
    severity: error
    retryable: true
    title_ru: "Смежный сервис не ответил"
    detail_ru: "Смежный сервис {service} не ответил за отведённое время."
    hint_ru: "Повторите попытку позже."
    details: {service: string}

  # ── Auth and security ──
  - code: UNAUTHENTICATED
    http: 401
    domain: auth
    severity: error
    log_level: INFO
    title_ru: "Требуется вход"
    detail_ru: "Для выполнения действия войдите в систему."
    hint_ru: "Войдите в систему и повторите действие."
    ui: {actions: [RELOGIN]}
  - code: INVALID_CREDENTIALS
    http: 401
    domain: auth
    severity: error
    security_event: true
    title_ru: "Неверные учётные данные"
    detail_ru: "Неверный логин или пароль."
    hint_ru: "Проверьте раскладку клавиатуры и повторите ввод."
  - code: SESSION_EXPIRED
    http: 401
    domain: auth
    severity: error
    log_level: INFO
    title_ru: "Сессия истекла"
    detail_ru: "Сессия истекла. Войдите в систему снова."
    hint_ru: "Войдите в систему; несохранённые данные формы сохранены в браузере."
    ui: {actions: [RELOGIN]}
  - code: REAUTH_REQUIRED
    http: 401
    domain: auth
    severity: error
    log_level: INFO
    title_ru: "Требуется подтверждение"
    detail_ru: "Подтвердите действие вводом пароля."
    hint_ru: "Введите пароль повторно, чтобы подтвердить действие."
    scenarios: [NS-G11]
  - code: ACCOUNT_LOCKED
    http: 423
    domain: auth
    severity: error
    retryable: true
    security_event: true
    alert: critical
    title_ru: "Учётная запись заблокирована"
    detail_ru: "Учётная запись временно заблокирована после {attempts} неудачных попыток входа. Повторите через {retry_after_min} мин."
    hint_ru: "Обратитесь к администратору, если блокировка не снимается."
    details: {attempts: integer, retry_after_min: integer}
  - code: IP_TEMPORARILY_BLOCKED
    http: 429
    domain: security
    severity: error
    retryable: true
    security_event: true
    alert: critical
    title_ru: "Доступ временно ограничен"
    detail_ru: "Доступ с вашего адреса временно ограничен. Повторите через {retry_after_min} мин."
    hint_ru: "Обратитесь к администратору."
    details: {retry_after_min: integer}
  - code: PASSWORD_CHANGE_REQUIRED
    http: 403
    domain: auth
    severity: error
    log_level: INFO
    title_ru: "Требуется смена пароля"
    detail_ru: "Перед продолжением работы смените пароль."
    hint_ru: "Откройте профиль и задайте новый пароль."
  - code: CSRF_TOKEN_INVALID
    http: 403
    domain: security
    severity: error
    security_event: true
    title_ru: "Недействительный токен формы"
    detail_ru: "Токен защиты формы недействителен. Обновите страницу."
    hint_ru: "Обновите страницу и повторите действие."
  - code: FORBIDDEN
    http: 403
    domain: auth
    severity: error
    security_event: true
    title_ru: "Недостаточно прав"
    detail_ru: "Недостаточно прав для выполнения действия."
    hint_ru: "Обратитесь к администратору для назначения роли."
    scenarios: [NS-A33, NS-G04]
  - code: SEPARATION_OF_DUTIES
    http: 403
    domain: auth
    severity: error
    security_event: true
    title_ru: "Нарушение разделения обязанностей"
    detail_ru: "Одно лицо не может выполнить оба действия: {first_action} и {second_action}."
    hint_ru: "Поручите действие другому пользователю с нужной ролью."
    details: {first_action: string, second_action: string}
  - code: SESSION_STORE_UNAVAILABLE
    http: 503
    domain: infra
    severity: error
    retryable: true
    alert: critical
    title_ru: "Сервис авторизации недоступен"
    detail_ru: "Сервис авторизации временно недоступен. Повторите попытку позже."
    hint_ru: "Повторите попытку через несколько минут."
    scenarios: [NS-E06]
  - code: PASSWORD_POLICY_VIOLATION
    http: 422
    domain: auth
    severity: error
    log_level: INFO
    status: proposed
    title_ru: "Пароль не соответствует требованиям"
    detail_ru: "Новый пароль не соответствует требованиям: {violations}."
    hint_ru: "Пароль — не короче 12 символов, не совпадает с логином и с последними паролями, не из списка распространённых."
    details: {violations: string}
    tz_ref: "09 §3.3.1 (password policy)"

  # ── Page rendering for the evidence viewer (AG-00 M1; ml-api /v1/render/*) ──
  - code: PAGE_NOT_FOUND
    http: 404
    domain: api
    severity: error
    log_level: INFO
    status: proposed
    title_ru: "Страница не найдена"
    detail_ru: "В файле {file_id} нет страницы {page_no} (всего страниц: {pdf_pages})."
    hint_ru: "Проверьте номер страницы: он считается с 1 по физическим страницам PDF."
    details: {file_id: string, page_no: integer, pdf_pages: integer}
  - code: FILE_NOT_RENDERABLE
    http: 422
    domain: api
    severity: error
    log_level: INFO
    status: proposed
    title_ru: "Файл нельзя показать"
    detail_ru: "Файл {file_id} нельзя показать постранично: {reason}."
    hint_ru: "Постранично показываются только PDF-файлы обучающих объектов, которые есть на диске."
    details: {file_id: string, reason: string}
  - code: PAGE_RENDERER_UNAVAILABLE
    http: 503
    domain: infra
    severity: error
    retryable: true
    alert: warning
    status: proposed
    title_ru: "Просмотр страниц недоступен"
    detail_ru: "Сервис отрисовки страниц временно недоступен ({reason})."
    hint_ru: "Запустите ml-api (make ml-api-dev) и повторите попытку."
    details: {reason: string}

  # ── Intake (transport and package limits) ──
  - code: NO_FILES
    http: 400
    domain: intake
    severity: error
    log_level: INFO
    title_ru: "Файлы не выбраны"
    detail_ru: "Не выбрано ни одного файла для загрузки."
    hint_ru: "Выберите файлы PDF, DOCX или XML."
    scenarios: [NS-A12]
  - code: NO_ACCEPTED_FILES
    http: 422
    domain: intake
    severity: error
    title_ru: "Ни один файл не принят"
    detail_ru: "Ни один файл пакета не принят. Причины указаны для каждого файла."
    hint_ru: "Исправьте файлы по указанным причинам и загрузите пакет повторно."
    scenarios: [NS-A13]
  - code: PACKAGE_TOO_LARGE
    http: 413
    domain: intake
    scope: package
    severity: error
    title_ru: "Превышен размер пакета"
    detail_ru: "Общий размер пакета ({total_mb} МБ) превышает лимит загрузки 5 ГБ. Пакет отклонён целиком — загрузите файлы несколькими пакетами."
    hint_ru: "Разделите файлы на несколько пакетов не более 5 ГБ."
    details: {total_mb: string, limit_bytes: integer, actual_bytes: integer}
    tz_ref: "ТЗ §9.1 «Обработка ошибок при загрузке»"
    scenarios: [NS-A09, NS-A10]
  - code: TOO_MANY_FILES
    http: 413
    domain: intake
    scope: package
    severity: error
    title_ru: "Слишком много файлов"
    detail_ru: "В пакете {count} файлов — максимум {limit}. Разделите пакет на части."
    hint_ru: "Разделите пакет на несколько частей."
    details: {count: integer, limit: integer}
    scenarios: [NS-A11]
  - code: FILE_TOO_LARGE
    http: 413
    domain: intake
    scope: file
    severity: error
    title_ru: "Превышен размер файла"
    detail_ru: "Файл «{file_name}» ({size_mb} МБ) превышает максимальный допустимый размер 500 МБ."
    hint_ru: "Разделите документ на части или уменьшите размер файла и загрузите повторно."
    details: {file_name: string, size_mb: string, size_bytes: integer, limit_bytes: integer}
    maps_to: {intake_status: REJECTED_SIZE}
    tz_ref: "ТЗ §9.1 «Обработка ошибок при загрузке»"
    scenarios: [NS-A07, NS-A08]
  - code: EMPTY_FILE
    http: 422
    domain: intake
    scope: file
    severity: error
    title_ru: "Пустой файл"
    detail_ru: "Файл «{file_name}» пустой (0 байт). Загрузите файл повторно."
    hint_ru: "Проверьте исходный файл и загрузите его повторно."
    details: {file_name: string}
    maps_to: {intake_status: REJECTED_EMPTY}
    scenarios: [NS-A06]
  - code: UNSUPPORTED_FORMAT
    http: 415
    domain: intake
    scope: file
    severity: error
    title_ru: "Формат не поддерживается"
    detail_ru: "Формат файла «{file_name}» не поддерживается. Допустимые форматы: PDF, DOCX, XML."
    hint_ru: "Сохраните документ в формате PDF, DOCX или XML."
    details: {file_name: string, detected: string, allowed: array}
    maps_to: {intake_status: REJECTED_FORMAT}
    tz_ref: "ТЗ §9.1 «Обработка ошибок при загрузке»"
    scenarios: [NS-A01, NS-A02, NS-A04, NS-A31]
  - code: CONTENT_TYPE_MISMATCH
    http: 415
    domain: intake
    scope: file
    severity: error
    security_event: true
    title_ru: "Содержимое не соответствует расширению"
    detail_ru: "Содержимое файла «{file_name}» не соответствует расширению .{ext} (определено: {detected}). Допустимые форматы: PDF, DOCX, XML."
    hint_ru: "Проверьте файл: расширение должно соответствовать его содержимому."
    details: {file_name: string, ext: string, detected: string}
    maps_to: {intake_status: REJECTED_MISMATCH}
    scenarios: [NS-A03]
  - code: MACRO_ENABLED_DOCUMENT
    http: 415
    domain: intake
    scope: file
    severity: error
    security_event: true
    title_ru: "Документ с макросами"
    detail_ru: "Файл «{file_name}» содержит макросы и не может быть принят. Сохраните документ как DOCX без макросов или PDF."
    hint_ru: "Сохраните документ без макросов."
    details: {file_name: string}
    scenarios: [NS-A05]
  - code: FILENAME_INVALID
    http: 422
    domain: intake
    scope: file
    severity: error
    title_ru: "Недопустимое имя файла"
    detail_ru: "Недопустимое имя файла. Переименуйте файл и загрузите повторно."
    hint_ru: "Используйте имя без служебных символов и путей."
    scenarios: [NS-A16]
  - code: CHECKSUM_MISMATCH
    http: 422
    domain: intake
    scope: file
    severity: error
    retryable: true
    title_ru: "Контрольная сумма не совпала"
    detail_ru: "Контрольная сумма файла «{file_name}» не совпала с переданной (повреждение при передаче). Загрузите файл повторно."
    hint_ru: "Загрузите файл повторно."
    details: {file_name: string}
    scenarios: [NS-A15]
  - code: VIRUS_DETECTED
    http: 422
    domain: security
    scope: file
    severity: error
    security_event: true
    alert: critical
    title_ru: "Обнаружено вредоносное содержимое"
    detail_ru: "Файл «{file_name}» не прошёл антивирусную проверку и отклонён. Администратор уведомлён."
    hint_ru: "Проверьте источник файла."
    details: {file_name: string}
    maps_to: {intake_status: REJECTED_INFECTED}
    scenarios: [NS-A25, NS-B28]
  - code: AV_UNAVAILABLE
    http: 503
    domain: infra
    scope: package
    severity: error
    retryable: true
    alert: critical
    title_ru: "Антивирусная проверка недоступна"
