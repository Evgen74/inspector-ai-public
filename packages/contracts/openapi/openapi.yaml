          application/json:
            schema: {$ref: '#/components/schemas/FinalizeRequest'}
      responses:
        '200':
          description: Протокол финализирован
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinalizeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '423': {$ref: '#/components/responses/Locked'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/unfinalize:
    post:
      operationId: unfinalizeProtocol
      tags: [verification]
      summary: Отмена финализации (причина, подтверждение паролем)
      description: |
        Доступна инспектору (п. 9.3 «Отмена финализации»); код причины UnfinalizeReason и текст не короче 20
        символов (422 UNFINALIZE_REASON_REQUIRED). Окончательная версия остаётся в истории (SUPERSEDED), создаётся
        рабочая версия N+2 в статусе VERIFICATION_COMPLETED; черновики GOLD этой версии приостанавливаются.
      x-owner: AG-05
      x-permission: protocol.unfinalize
      x-audit-action: PROTOCOL_UNFINALIZED
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, VERIFICATION_NOT_ALLOWED_IN_STATUS, UNFINALIZE_FORBIDDEN, UNFINALIZE_REASON_REQUIRED, REAUTH_REQUIRED, CONTRACT_VALIDATION_FAILED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnfinalizeRequest'}
      responses:
        '200':
          description: Финализация отменена
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnfinalizeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/completeness:
    get:
      operationId: getCompleteness
      tags: [verification]
      summary: Комплектность отдельно от кандидатов (статус загрузки, «Тип проверки», непроверенные параметры)
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
      responses:
        '200':
          description: Комплектность
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompletenessView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/protocol:
    get:
      operationId: getProcessProtocol
      tags: [verification]
      summary: Версия протокола проверки (текущая или по номеру) — документ контракта protocol
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - name: version
          in: query
          schema: {type: integer, minimum: 1, maximum: 100000}
      responses:
        '200':
          description: Версия протокола
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessProtocol'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/rin-payload/preview:
    get:
      operationId: previewRinPayload
      tags: [verification]
      summary: Что будет передано в ИАИС «РиН» — только подтверждённые инспектором нарушения
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
      responses:
        '200':
          description: Предпросмотр передачи
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RinPayloadPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/usability:
    get:
      operationId: getUsabilityReport
      tags: [verification]
      summary: Юзабилити верификации — время на протокол и на карточку, клики на решение (п. 9.3 ТЗ)
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
      responses:
        '200':
          description: Отчёт
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsabilityReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /dictionaries/decision-codes:
    get:
      operationId: getDecisionCodes
      tags: [verification]
      summary: Справочники кодов решений (причины отклонения, основания подтверждения и уточнения)
      x-owner: AG-05
      x-permission: matrix.read
      x-error-codes: [UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      responses:
        '200':
          description: Коды из packages/contracts/enums.yaml
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionCodes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
  /telemetry/ui-events:
    post:
      operationId: postUiEvents
      tags: [verification]
      summary: События интерфейса верификации для отчёта юзабилити (до 200 за вызов)
      x-owner: AG-05
      x-permission: evidence.read
      x-audit-action: HTTP_POST
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UiEventsRequest'}
      responses:
        '202':
          description: События приняты
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UiEventsAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /ml/datasets/draft/items:
    get:
      operationId: listDatasetDraftItems
      tags: [ml-feedback]
      summary: Черновики набора данных (Dataset_Items, ТЗ §10 табл. 15) из финальных решений инспектора
      description: |
        Метка в формате эталона организаторов (gold_check.schema.json; CONFIRMED/REJECTED словаря v1.0),
        карточка доказательств, версии источников, разбиение по объекту. Черновик попадает в выпуск набора только
        после проверки куратором; в ответ для организаторов решения инспектора не попадают никогда.
      x-owner: AG-05
      x-permission: dataset.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - name: process_id
          in: query
          schema: {type: string, format: uuid}
        - name: object_id
          in: query
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DatasetItemStatusCode'}
      responses:
        '200':
          description: Черновики
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetItemList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ii_sid
      description: Непрозрачный токен сессии (256 бит); на сервере хранится только его sha256 (Redis). При INSPECTOR_COOKIE_SECURE — `__Host-ii_sid`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: csrf_token из ответа входа или GET /auth/me; обязателен для POST/PUT/PATCH/DELETE при входе по сессии.

  headers:
    ETag:
      description: Версия изображения (sha256 файла, страница, параметры отрисовки); для If-None-Match
      schema: {type: string}
    CacheControl:
      description: private, max-age=86400, immutable — отрисовка неизменна для данного sha256 файла
      schema: {type: string}
    XRequestId:
      description: Идентификатор запроса (переданный клиентом или UUID v7); тот же, что в логах и в теле ошибки
      schema: {type: string}
    RowVersionETag:
      description: 'Версия записи (row_version) в кавычках, например "3"; передаётся обратно в If-Match'
      schema: {type: string}
    IdempotencyReplayed:
      description: 'true — ответ повторён по тому же Idempotency-Key (действие не выполнялось повторно)'
      schema: {type: string}

  parameters:
    FileIdPath:
      name: file_id
      in: path
      required: true
      description: Идентификатор файла (file_id манифеста)
      schema: {type: string, minLength: 1, maxLength: 512}
    PageNoPath:
      name: page_no
      in: path
      required: true
      description: Номер страницы PDF, с 1 (физическая страница, не номер листа)
      schema: {type: integer, minimum: 1, maximum: 100000}
    ObjectIdPath:
      name: object_id
      in: path
      required: true
      description: Идентификатор объекта (object_id манифеста)
      schema: {type: string, minLength: 1, maxLength: 64}
    Page:
      name: page
      in: query
      description: Номер страницы, с 1
      schema: {type: integer, minimum: 1, maximum: 100000, default: 1}
    PageSize:
      name: page_size
      in: query
      description: Размер страницы (не более 200)
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    RunIdPath:
      name: run_id
      in: path
      required: true
      description: Внутренний идентификатор импортированного запуска (UUID v7, поле id в /admin/batch-runs)
      schema: {type: string, format: uuid}
    ProcessIdPath:
      name: process_id
      in: path
      required: true
      description: Идентификатор проверки (процесса), UUID
      schema: {type: string, format: uuid}
    FindingIdPath:
      name: finding_id
      in: path
      required: true
      description: Идентификатор атомарной находки (finding_id)
      schema: {type: string, minLength: 1, maxLength: 96}
    DisputeIdPath:
      name: dispute_id
      in: path
      required: true
      description: Идентификатор спора (Dispute_Log)
      schema: {type: integer, minimum: 1}
    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      description: 'row_version из ETag (находки — для решений и споров; процесса — для взятия в работу, возобновления, финализации и отмены); без него — 428 PRECONDITION_REQUIRED'
      schema: {type: string, minLength: 1, maxLength: 32}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID запроса; повтор с тем же ключом возвращает сохранённый ответ
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: Запрос не прошёл проверку схемы (VALIDATION_ERROR, MALFORMED_JSON)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Ресурс не найден (NOT_FOUND)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Конфликт с уже сохранёнными данными (FILE_ID_IMMUTABLE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: Неподдерживаемый тип содержимого (UNSUPPORTED_MEDIA_TYPE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Запрос не может быть выполнен (CONTRACT_VALIDATION_FAILED, PASSWORD_POLICY_VIOLATION, FILE_NOT_RENDERABLE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Требуется вход или сессия истекла (UNAUTHENTICATED, SESSION_EXPIRED, INVALID_CREDENTIALS, REAUTH_REQUIRED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccessDenied:
      description: Недостаточно прав, неверный токен формы или требуется смена пароля (FORBIDDEN, CSRF_TOKEN_INVALID, PASSWORD_CHANGE_REQUIRED, HIDDEN_TEST_ACCESS_DENIED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Locked:
      description: Ресурс заблокирован (ACCOUNT_LOCKED, PROTOCOL_FINALIZED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Превышен лимит попыток (IP_TEMPORARILY_BLOCKED, RATE_LIMITED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Внутренняя ошибка (INTERNAL_ERROR, RESPONSE_SCHEMA_VIOLATION)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Сервис временно недоступен (DB_UNAVAILABLE, SESSION_STORE_UNAVAILABLE, PAGE_RENDERER_UNAVAILABLE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    VerificationConflict:
      description: Конфликт версии или статуса (VERSION_CONFLICT, EVIDENCE_CHANGED, FINDING_LOCKED_BY_RECHECK, VERIFICATION_NOT_ALLOWED_IN_STATUS, FINALIZE_GATE_BLOCKED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: Нет заголовка If-Match (PRECONDITION_REQUIRED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ── Contract enums (values must equal packages/contracts/enums.yaml; checked by a test) ──
    ManifestStage:
      type: string
      x-contract-enum: ManifestStage
      enum: [PD, RD, ID, RD_ID_MIXED, UNKNOWN]
    DocStageOrNull:
      type: string
      nullable: true
      x-contract-enum: DocStage
      enum: [PD, RD, ID, null]
    ManifestSplit:
      type: string
      x-contract-enum: ManifestSplit
      enum: [TRAIN_PUBLIC, TEST_HIDDEN]
    ManifestSplitOrNull:
      type: string
      nullable: true
      x-contract-enum: ManifestSplit
      enum: [TRAIN_PUBLIC, TEST_HIDDEN, null]
    LocalFileStatus:
      type: string
      x-contract-enum: LocalFileStatus
      enum: [PRESENT, RECOVERED, MISSING_ON_DISK]
    LoadScenarioOrNull:
      type: string
      nullable: true
      x-contract-enum: LoadScenario
      enum: [FULL, PD_RD_ONLY, PD_ID_ONLY, RD_ID_ONLY, SINGLE_ONLY, PARTIALLY_LOADED, null]
    IndicatorColor:
      type: string
      x-contract-enum: IndicatorColor
      enum: [RED, YELLOW, GREEN, NONE]
    RunStatus:
      type: string
      x-contract-enum: RunStatus
      enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED]
    Role:
      type: string
      x-contract-enum: Role
      enum: [INSPECTOR]
    PermissionScope:
      type: string
      x-contract-enum: PermissionScope
      enum: [ALL, ASSIGNED, OWN]
    AuditAction:
      type: string
      x-contract-enum: AuditAction
      enum: [AUTH_LOGIN_SUCCESS, AUTH_LOGIN_FAILED, AUTH_LOCKED, AUTH_LOGOUT, AUTH_REAUTH, AUTH_PASSWORD_CHANGED, SESSION_REVOKED, ACCESS_DENIED, USER_CREATED, USER_UPDATED, USER_ROLE_CHANGED, USER_DEACTIVATED, OBJECT_ASSIGNMENT_CHANGED, CONFIG_CHANGED, PARAM_UPDATED, BATCH_RUN_IMPORTED, PROTOCOL_VERSION_CREATED, PROTOCOL_OPENED, EVIDENCE_VIEWED, FINDING_CONFIRMED, FINDING_REJECTED, FINDING_CLARIFICATION_REQUESTED, FINDING_DECISION_REVERTED, DECISION_OVERRIDE, FINDING_SPLIT, REVISION_SELECTED, SUSPICION_PROMOTED, SUSPICION_DISMISSED, VERIFICATION_COMPLETED, PROTOCOL_FINALIZED, PROTOCOL_UNFINALIZED, PROTOCOL_EXPORTED, RIN_SYNC_REQUESTED, RIN_SYNC_RESULT, SELFTEST_RUN, RETENTION_PURGE_EXECUTED, HTTP_POST, HTTP_PUT, HTTP_PATCH, HTTP_DELETE]
    AuditCategory:
      type: string
      x-contract-enum: AuditCategory
      enum: [BUSINESS, SECURITY, SYSTEM, INTEGRATION, ACCESS]
    AuditResult:
      type: string
      x-contract-enum: AuditResult
      enum: [SUCCESS, FAILURE, DENIED]
    AuditActorType:
      type: string
      x-contract-enum: AuditActorType
      enum: [USER, SYSTEM, INTEGRATION, ANONYMOUS]
    AuditObjectType:
      type: string
      x-contract-enum: AuditObjectType
