      x-owner: AG-08
      x-permission: documents.upload
      x-error-codes:
        - VALIDATION_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - NO_FILES
        - NO_ACCEPTED_FILES
        - PACKAGE_TOO_LARGE
        - TOO_MANY_FILES
        - PAYLOAD_TOO_LARGE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - PASSWORD_CHANGE_REQUIRED
        - CSRF_TOKEN_INVALID
        - FORBIDDEN
        - SESSION_STORE_UNAVAILABLE
        - INTERNAL_ERROR
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Разобранное тело multipart ({fields, files})
              properties:
                fields: {type: object, additionalProperties: {type: string}}
                files: {type: array, items: {type: object}}
