      operationId: uploadDocuments
      tags: [upload]
      summary: Загрузить комплект документов и запустить проверку
      description: |
        `multipart/form-data`: поля `files` (повторяемое; PDF, DOCX, XML или архивы ZIP/7z/RAR), необязательные
        `registry` (реестр CSV/XLSX/JSON: файл, стадия, раздел), `object_name`, `address`.
        Лимиты: 500 МБ на документ (в том числе внутри архива), 5 ГБ на пакет (подняты относительно ТЗ §9.1 — 50 МБ
        и 200 МБ — решением руководителя, чтобы полный комплект объекта помещался в один архив). Пакет, превысивший
        лимит, отклоняется целиком; отдельные неверные файлы отклоняются с указанием причины, остальные принимаются
        (202, поле `rejected`).
