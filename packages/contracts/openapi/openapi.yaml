openapi: 3.0.3
info:
  title: «Инспектор ИИ» — REST API
  version: 0.1.0
  description: |
    Контракт REST API веб-продукта «Инспектор ИИ» (M1). Документ ведёт AG-00 (контракты); владелец каждой
    операции указан в `x-owner`.

    Правила (docs/analysis/90 §3.4):
    - JSON snake_case, перечисления — строки из `packages/contracts/enums.yaml`
      (поле `x-contract-enum` указывает перечисление; совпадение проверяется тестом).
    - Ошибки — `application/problem+json` (RFC 9457) по `packages/contracts/schemas/problem.schema.json`,
      коды — из `packages/contracts/errors.yaml`.
    - Каждый ответ несёт заголовок `X-Request-Id` (переданный клиентом или сгенерированный UUID v7).
    - Запросы проверяются по этому документу; в режимах local/test проверяются и ответы.
    - Веб-продукт импортирует каталоги запусков `inspector-batch` (97 §2.14); решения инспектора
      никогда не попадают в выгрузку для организаторов.
    - Вход по логину и паролю (09 §3.3.1): сессия в cookie `ii_sid` (HttpOnly, SameSite=Strict; `__Host-ii_sid`
      при INSPECTOR_COOKIE_SECURE), для POST/PUT/PATCH/DELETE — заголовок `X-CSRF-Token` из ответа входа.
      `security: []` — операция доступна без входа; `x-permission` — право из `packages/contracts/rbac.yaml`
      (роль → право → область ALL | ASSIGNED | OWN); `x-allow-password-change: true` — операция доступна до
      обязательной смены пароля; `x-audit-action` — действие журнала аудита для изменяющей операции.
    - Каждое изменение (POST/PUT/PATCH/DELETE) и каждый отказ в доступе (403) записываются в журнал аудита.
  x-owner: AG-00
servers:
  - url: /api/v1
tags:
  - name: health
    description: Состояние сервиса
  - name: objects
    description: Объекты и их документы (реестр файлов)
  - name: admin
    description: "Администрирование: импорт запусков inspector-batch, пользователи и роли"
  - name: auth
    description: Вход, выход, сессия, смена пароля, подтверждение паролем
  - name: audit
    description: Журнал аудита (ТЗ §10 табл. 12)
  - name: viewer
    description: Страницы документов для просмотра доказательств (обучающие объекты)
  - name: archive
    description: Архивирование объектов, прогонов и проверок
  - name: dashboard
    description: 'Дашборд инспектора (модуль 7): индикация объектов, фильтры, сводка находок'
  - name: protocols
    description: Протоколы по форме Приложения 2 (версии, просмотр, выгрузка DOCX/PDF/JSON)
  - name: pages
    description: Разметка страниц документов для просмотрщика доказательств (облака изменений, помещения)
  - name: normative
    description: 'Нормативная база: матрица 132 параметров, пороги, версии'
  - name: rin
    description: 'ИАИС «РиН»: заглушка обмена'
  - name: ml-report
    description: Еженедельный отчёт по дообучению
  - name: upload
    description: Загрузка документов и статус обработки (модуль 1)
  - name: verification
    description: 'Верификация кандидатов: очередь, карточка доказательств, решения, споры с ИИ, финализация'
  - name: ml-feedback
    description: Черновики набора данных (GOLD) из финальных решений инспектора
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Состояние API и базы данных
      security: []
      x-owner: AG-08
      x-error-codes: []
      responses:
        '200':
          description: Сервис и база данных доступны
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: База данных недоступна (тело — то же Health со статусом degraded)
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /objects:
    get:
      operationId: listObjects
      tags: [objects]
      summary: Список объектов с количеством файлов по стадиям
      x-owner: AG-08
      x-permission: object.read
      x-error-codes: [VALIDATION_ERROR, DB_UNAVAILABLE, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Поиск по идентификатору или наименованию объекта (без учёта регистра)
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: include_archived
          in: query
          description: Показывать и архивные объекты («Архивировать»); по умолчанию они скрыты
          schema: {type: boolean}
      responses:
        '200':
          description: Страница списка объектов (сортировка по object_id)
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /objects/{object_id}:
    get:
      operationId: getObject
      tags: [objects]
      summary: Карточка объекта
      x-owner: AG-08
      x-permission: object.read
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, DB_UNAVAILABLE, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: Объект
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /objects/{object_id}/files:
    get:
      operationId: listObjectFiles
      tags: [objects]
      summary: Файлы объекта (реестр документов)
      x-owner: AG-08
      x-permission: object.read
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, DB_UNAVAILABLE, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: stage
          in: query
          description: Фильтр по стадии из манифеста
          schema: {$ref: '#/components/schemas/ManifestStage'}
        - name: local_status
          in: query
          description: Фильтр по наличию файла на диске
          schema: {$ref: '#/components/schemas/LocalFileStatus'}
        - name: q
          in: query
          description: Поиск по file_id, имени файла или относительному пути (без учёта регистра)
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Страница файлов объекта (сортировка по file_id)
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/batch-runs:
    get:
      operationId: listBatchRuns
      tags: [admin]
      summary: Импортированные запуски inspector-batch (новые сверху)
      x-owner: AG-08
      x-permission: batch.read
      x-error-codes: [VALIDATION_ERROR, DB_UNAVAILABLE, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: include_archived
          in: query
          description: Показывать и архивные прогоны («Архивировать»); по умолчанию они скрыты
          schema: {type: boolean}
      responses:
        '200':
          description: Страница импортированных запусков
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchRunList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/batch-runs/import:
    post:
      operationId: importBatchRun
      tags: [admin]
      summary: Импорт каталога запуска inspector-batch (инвентаризация и артефакты)
      description: |
        Читает `<run_dir>/run_manifest.json` (схема `run_manifest.schema.json`), проверяет его по контракту и
        записывает запуск, объекты и файлы. Описательные поля файлов (путь, раздел, размер, наименование объекта)
        берутся из манифеста организаторов `document_manifest.jsonl`, если его sha256 совпадает с
        `inputs.manifest_sha256` запуска. Каталог должен лежать внутри каталога запусков (`INSPECTOR_RUNS_ROOT`).
        Повторный импорт того же запуска идемпотентен (200). Для объектов скрытой выборки импортируется только
        инвентаризация; ссылки на артефакты не читаются.

        Импорт v2 (AG-00): если в каталоге есть `artifacts.json` (схема `run_artifacts`), по нему читаются
        артефакты обучающих объектов — группы находок, атомарные находки, протокол (JSON, DOCX, PDF), ответ
        (полный, строгий, сопроводительный файл); размер и sha256 каждого файла сверяются с индексом, каждая
        запись — со своей схемой контракта. Они сохраняются в processes, protocols (версии), evidence_groups,
        checks, evidence_fragments, suspicions, submission_exports; прочие артефакты (разметка листов,
        таблицы) — как ссылки в run_artifacts. Новая версия протокола создаётся только при изменении
        содержимого; решения инспектора при повторном импорте сохраняются; финализированный протокол не
        заменяется (423 PROTOCOL_FINALIZED).
      x-owner: AG-08
      x-permission: batch.import
      x-audit-action: BATCH_RUN_IMPORTED
      x-error-codes:
        - VALIDATION_ERROR
        - MALFORMED_JSON
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - PASSWORD_CHANGE_REQUIRED
        - CSRF_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CONTRACT_VALIDATION_FAILED
        - FILE_ID_IMMUTABLE
        - PROTOCOL_FINALIZED
        - SESSION_STORE_UNAVAILABLE
        - DB_UNAVAILABLE
        - INTERNAL_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRunImportRequest'}
      responses:
        '200':
          description: Запуск уже был импортирован; данные обновлены
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchRunImportResult'}
        '201':
          description: Запуск импортирован впервые
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchRunImportResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '423': {$ref: '#/components/responses/Locked'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  # ── Platform services (AG-00): auth, users, audit, page viewer ──
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход по логину и паролю
      description: |
        Проверяет пароль (argon2id) и открывает сессию: cookie `ii_sid` (HttpOnly, SameSite=Strict) и `csrf_token`
        в теле. После 5 неудачных попыток учётная запись блокируется на 15 минут (423 ACCOUNT_LOCKED); после 20
        неудачных попыток за 10 минут с одного адреса адрес блокируется на 30 минут (429). Каждая попытка
        записывается в журнал аудита (AUTH_LOGIN_SUCCESS, AUTH_LOGIN_FAILED, AUTH_LOCKED).
      security: []
      x-owner: AG-00
      x-audit-action: AUTH_LOGIN_SUCCESS
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, INVALID_CREDENTIALS, ACCOUNT_LOCKED, IP_TEMPORARILY_BLOCKED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Сессия открыта; Set-Cookie несёт токен сессии
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Set-Cookie: {description: 'ii_sid=…; HttpOnly; SameSite=Strict; Path=/', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Выход (сессия удаляется)
      x-owner: AG-00
      x-allow-password-change: true
      x-audit-action: AUTH_LOGOUT
      x-error-codes: [UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      responses:
        '204':
          description: Сессия закрыта, cookie удалена
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Текущий пользователь, роли, права и токен формы
      description: Веб-интерфейс строит меню по `permissions` (права из rbac.yaml с областью ALL | ASSIGNED | OWN).
      x-owner: AG-00
      x-allow-password-change: true
      x-error-codes: [UNAUTHENTICATED, SESSION_EXPIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      responses:
        '200':
          description: Сессия действительна
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Смена пароля
      description: |
        Пароль — не короче 12 символов, не совпадает с логином, не из списка распространённых и не один из пяти
        последних (09 §3.3.1). Остальные сессии пользователя закрываются.
      x-owner: AG-00
      x-allow-password-change: true
      x-audit-action: AUTH_PASSWORD_CHANGED
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, INVALID_CREDENTIALS, PASSWORD_POLICY_VIOLATION, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204':
          description: Пароль изменён
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/reauth:
    post:
      operationId: reauth
      tags: [auth]
      summary: Подтверждение действия паролем (токен на 5 минут, одноразовый)
      description: |
        Нужен для действий с `reauth: true` в rbac.yaml (финализация, отмена финализации, управление ролями,
        утверждение модели): токен передаётся в теле такого запроса и расходуется им. Это «простая электронная
        подпись» решения инспектора в MVP (09 §3.3.1, 97 ruling 20).
      x-owner: AG-00
      x-audit-action: AUTH_REAUTH
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, CSRF_TOKEN_INVALID, INVALID_CREDENTIALS, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReauthRequest'}
      responses:
        '200':
          description: Токен подтверждения
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReauthToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Пользователи, их роли и назначенные объекты
      x-owner: AG-00
      x-permission: users.manage
      x-error-codes: [VALIDATION_ERROR, UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Поиск по логину или ФИО (без учёта регистра)
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: role
          in: query
          description: Только пользователи с этой ролью
          schema: {$ref: '#/components/schemas/Role'}
      responses:
        '200':
          description: Страница пользователей (сортировка по логину)
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/roles:
    get:
      operationId: getRoleMatrix
      tags: [admin]
      summary: Матрица ролей и прав (packages/contracts/rbac.yaml, только чтение)
      x-owner: AG-00
      x-permission: users.manage
      x-error-codes: [UNAUTHENTICATED, SESSION_EXPIRED, PASSWORD_CHANGE_REQUIRED, FORBIDDEN, SESSION_STORE_UNAVAILABLE, INTERNAL_ERROR]
      responses:
        '200':
          description: Права и области по ролям
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleMatrix'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Журнал аудита (новые сверху)
      description: |
