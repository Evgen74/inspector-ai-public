components:
  headers:
    RowVersionETag:
      description: 'Версия записи (row_version) в кавычках, например "3"; передаётся обратно в If-Match'
      schema: {type: string}
    IdempotencyReplayed:
      description: 'true — ответ повторён по тому же Idempotency-Key (действие не выполнялось повторно)'
      schema: {type: string}
  parameters:
    ProcessIdPath:
      name: process_id
      in: path
      required: true
      description: Идентификатор проверки (процесса), UUID
      schema: {type: string, format: uuid}
    FindingIdPath:
      name: finding_id
      in: path
      required: true
      description: Идентификатор атомарной находки (finding_id)
      schema: {type: string, minLength: 1, maxLength: 96}
    DisputeIdPath:
      name: dispute_id
      in: path
      required: true
      description: Идентификатор спора (Dispute_Log)
      schema: {type: integer, minimum: 1}
    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      description: 'row_version из ETag (находки — для решений и споров; процесса — для взятия в работу, возобновления, финализации и отмены); без него — 428 PRECONDITION_REQUIRED'
      schema: {type: string, minLength: 1, maxLength: 32}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID запроса; повтор с тем же ключом возвращает сохранённый ответ
      schema: {type: string, format: uuid}
  responses:
    VerificationConflict:
      description: Конфликт версии или статуса (VERSION_CONFLICT, EVIDENCE_CHANGED, FINDING_LOCKED_BY_RECHECK, VERIFICATION_NOT_ALLOWED_IN_STATUS, FINALIZE_GATE_BLOCKED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: Нет заголовка If-Match (PRECONDITION_REQUIRED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    # ── Contract enums (values must equal packages/contracts/enums.yaml) ──
    InspectorStatusCode:
      type: string
      x-contract-enum: InspectorStatus
      enum: [PENDING, CONFIRMED_VIOLATION, NEGATIVE_VERIFIED, CLARIFICATION_REQUIRED]
    InspectorStatusCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: InspectorStatus
      enum: [PENDING, CONFIRMED_VIOLATION, NEGATIVE_VERIFIED, CLARIFICATION_REQUIRED, null]
    DecisionTypeCode:
      type: string
      x-contract-enum: DecisionType
      enum: [CONFIRMED_VIOLATION, NEGATIVE_VERIFIED, CLARIFICATION_REQUIRED, REVERT_TO_PENDING]
    RejectReasonCode:
      type: string
      x-contract-enum: DecisionRejectReason
      enum: [WRONG_REVISION, APPROVED_CHANGE, OCR_ERROR, EXTRACTION_ERROR, CV_ERROR, LINKING_ERROR, WITHIN_TOLERANCE, EQUIVALENT_SOLUTION, METHODOLOGY_DIFFERENCE, NOT_APPLICABLE_PARAM, DUPLICATE, OTHER]
    RejectReasonCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: DecisionRejectReason
      enum: [WRONG_REVISION, APPROVED_CHANGE, OCR_ERROR, EXTRACTION_ERROR, CV_ERROR, LINKING_ERROR, WITHIN_TOLERANCE, EQUIVALENT_SOLUTION, METHODOLOGY_DIFFERENCE, NOT_APPLICABLE_PARAM, DUPLICATE, OTHER, null]
    ConfirmBasisCode:
      type: string
      x-contract-enum: DecisionConfirmBasis
      enum: [CV_DEVIATION_PD_RD, CV_MISSING_IN_RD, CV_NOT_PER_RD, CV_TOLERANCE_EXCEEDED, CV_UNAPPROVED_CHANGE, CV_NORM_VIOLATION]
    ConfirmBasisCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: DecisionConfirmBasis
      enum: [CV_DEVIATION_PD_RD, CV_MISSING_IN_RD, CV_NOT_PER_RD, CV_TOLERANCE_EXCEEDED, CV_UNAPPROVED_CHANGE, CV_NORM_VIOLATION, null]
    ClarifyBasisCode:
      type: string
      x-contract-enum: DecisionClarifyBasis
      enum: [REVISION_CONFLICT, APPROVAL_UNKNOWN, AMBIGUOUS_CHAIN, NO_REGISTRY, AWAITING_DOCUMENT, AWAITING_APPROVAL_CHECK, SOURCE_UNREADABLE, EXPERT_CONSULTATION]
    ClarifyBasisCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: DecisionClarifyBasis
      enum: [REVISION_CONFLICT, APPROVAL_UNKNOWN, AMBIGUOUS_CHAIN, NO_REGISTRY, AWAITING_DOCUMENT, AWAITING_APPROVAL_CHECK, SOURCE_UNREADABLE, EXPERT_CONSULTATION, null]
    CommentSourceCode:
      type: string
      x-contract-enum: CommentSource
      enum: [TEMPLATE, EDITED, MANUAL]
    CommentSourceCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: CommentSource
      enum: [TEMPLATE, EDITED, MANUAL, null]
    PlannedActionCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: PlannedAction
      enum: [ISSUE_ORDER, REQUEST_EXPLANATION, REQUEST_DOCUMENTS, SCHEDULE_INSPECTION, NO_FURTHER_ACTION, null]
    AiVerdictCode:
      type: string
      x-contract-enum: AiVerdict
      enum: [AGREE, UNCERTAIN, DISAGREE]
    AiVerdictCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: AiVerdict
      enum: [AGREE, UNCERTAIN, DISAGREE, null]
    GoldEffectCode:
      type: string
      x-contract-enum: GoldEffect
      enum: [POSITIVE_DRAFT, NEGATIVE_DRAFT, WITHDRAW, NONE]
    DisputeResolutionStatusCode:
      type: string
      x-contract-enum: DisputeResolutionStatus
      enum: [OPEN, INSPECTOR_UPHELD, AI_UPHELD, KEPT_CLARIFICATION, ESCALATED, WITHDRAWN]
    ProtocolVersionReasonCode:
      type: string
      x-contract-enum: ProtocolVersionReason
      enum: [INITIAL, INCREMENTAL_UPDATE, RECHECK, FINALIZATION, UNFINALIZATION]
    CheckLifecycleCode:
      type: string
      x-contract-enum: CheckLifecycle
      enum: [ACTIVE, SPLIT, SUPERSEDED]
    CheckKindCode:
      type: string
      x-contract-enum: CheckKind
      enum: [MATRIX, RULE, SUSPICION_CONVERTED, SPLIT_CHILD]
    MatrixScopeCode:
      type: string
      x-contract-enum: MatrixScope
      enum: [MATRIX, FREE_SEARCH]
    FindingStatusCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: FindingStatus
      enum: [CANDIDATE, NEGATIVE_VERIFIED, CONFIRMED_VIOLATION, SUSPICION, null]
    CompletenessStatusCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: CompletenessStatus
      enum: [COMPLETE, MISSING_EVIDENCE, NOT_APPLICABLE, NOT_COMPARABLE, CLARIFICATION_REQUIRED, null]
    DecidedByCodeOrNull:
      type: string
      nullable: true
      x-contract-enum: DecidedBy
      enum: [SYSTEM, INSPECTOR, null]
    GoldLabelCode:
      type: string
      x-contract-enum: GoldLabel
      enum: [POSITIVE, NEGATIVE]
    DatasetItemStatusCode:
      type: string
      x-contract-enum: DatasetItemStatus
      enum: [DRAFT, PENDING_CURATION, INELIGIBLE, DISPUTED, SUSPENDED, ACCEPTED, EXCLUDED, RETURNED, RELEASED, REVOKE_PENDING]
    DatasetSplitCode:
      type: string
      x-contract-enum: Split
      enum: [TRAIN, VALIDATION, HIDDEN_TEST]
    SourceTypeCode:
      type: string
      x-contract-enum: SourceType
      enum: [PRODUCTION, PILOT, SYNTHETIC, IMPORTED]
    # ── Proposed vocabularies (AG-05 → AG-00, enums.yaml) ──
    QueueTabCode:
      type: string
      x-contract-enum-proposed: VerificationQueueTab
      enum: [ALL, PENDING, CLARIFICATION, CONFIRMED, NEGATIVE, DISPUTES]
    GateBlockerCode:
      type: string
      x-contract-enum-proposed: FinalizeBlocker
      enum: [PENDING_CANDIDATE, OPEN_DISPUTE, PROCESS_NOT_COMPLETED, RECHECK_IN_PROGRESS, RECHECK_FAILED]
    GateWarningCode:
      type: string
      x-contract-enum-proposed: FinalizeWarning
      enum: [CLARIFICATION_KEPT, MISSING_EVIDENCE, NOT_COMPARABLE, PENDING_SUSPICIONS]
    UiEventTypeCode:
      type: string
      x-contract-enum-proposed: UiEventType
      enum: [SESSION_START, CARD_SHOWN, DECISION_COMMITTED, DECISION_REVERTED, HOTKEY_HELP_OPENED, FINALIZE_OPENED, FINALIZE_COMMITTED, IDLE_START, IDLE_END, ERROR_SHOWN]
    UiInputModeCodeOrNull:
      type: string
      nullable: true
      x-contract-enum-proposed: UiInputMode
      enum: [MOUSE, KEYBOARD, MIXED, null]
    DisputeResolutionCode:
      type: string
      x-contract-enum-proposed: DisputeResolution
      description: Исход, который выбирает инспектор (подмножество DisputeResolutionStatus)
      enum: [INSPECTOR_UPHELD, AI_UPHELD, KEPT_CLARIFICATION]
    # ── Shared shapes ──
    TimestampOrNull:
      type: string
      format: date-time
      nullable: true
    NullObject:
      type: object
      nullable: true
      maxProperties: 0
      description: 'Значение отсутствует (null)'
    UserRef:
      type: object
      additionalProperties: false
      required: [user_id, full_name]
      properties:
        user_id: {type: string}
        full_name: {type: string}
    UserRefOrNull:
      type: object
      nullable: true
      additionalProperties: false
      required: [user_id, full_name]
      properties:
        user_id: {type: string}
        full_name: {type: string}
    GateBlocker:
      type: object
      additionalProperties: false
      required: [code, count, finding_ids]
      properties:
        code: {$ref: '#/components/schemas/GateBlockerCode'}
        count: {type: integer, minimum: 0}
        finding_ids: {type: array, items: {type: string}}
    GateWarning:
      type: object
      additionalProperties: false
      required: [code, count, finding_ids]
      properties:
        code: {$ref: '#/components/schemas/GateWarningCode'}
        count: {type: integer, minimum: 0}
        finding_ids: {type: array, items: {type: string}}
    FinalizeGate:
      type: object
      additionalProperties: false
      required: [can_finalize, blockers, warnings]
      properties:
        can_finalize: {type: boolean}
        blockers: {type: array, items: {$ref: '#/components/schemas/GateBlocker'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/GateWarning'}}
    ProtocolVersionRef:
      type: object
      additionalProperties: false
      required: [protocol_id, version, protocol_no, status, is_final, version_reason, content_sha256, generated_at, finalized_at, finalized_by, superseded_at, superseded_reason]
      properties:
        protocol_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        protocol_no: {type: string}
        status: {$ref: '#/components/schemas/ProtocolStatus'}
