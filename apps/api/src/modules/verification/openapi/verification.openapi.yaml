# «Инспектор ИИ» — verification additions to the REST contract (owner AG-05), PENDING ADOPTION by AG-00.
#
# Module 3 «Верификация инспектором» (ТЗ §9.3), 90 §3.4 G, 05 §3.15. Merge = copy `tags`, `paths` and
# `components.*` into packages/contracts/openapi/openapi.yaml (or drop this file into apps/api/openapi/pending/
# together with the AppModule wiring of VERIFICATION_CONTROLLERS). Component names are unique to this module.
#
# Writes need `Idempotency-Key` (UUID; a replay returns the stored response with `Idempotency-Replayed: true`,
# the same key with another body → 422 IDEMPOTENCY_KEY_REUSED) and `If-Match` (row_version from `ETag`;
# missing → 428 PRECONDITION_REQUIRED, stale → 409 VERSION_CONFLICT).
# Decisions live in the web product only and never reach a submission (97 §1.4).
#
# Enums proposed for enums.yaml (marked `x-contract-enum-proposed`): VerificationQueueTab, FinalizeBlocker,
# FinalizeWarning, UiEventType, UiInputMode, DisputeResolution (the inspector-chosen subset of
# DisputeResolutionStatus).
openapi: 3.0.3
info:
  title: «Инспектор ИИ» — верификация инспектором (модуль 3)
  version: 0.1.0-m1
tags:
  - name: verification
    description: 'Верификация кандидатов: очередь, карточка доказательств, решения, споры с ИИ, финализация'
  - name: ml-feedback
    description: 'Черновики набора данных (GOLD) из финальных решений инспектора'
paths:
  /objects/{object_id}/verification:
    get:
      operationId: getObjectVerification
      tags: [verification]
      summary: Проверки объекта с состоянием верификации
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: Проверки (процессы) объекта, новые сначала
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectVerification'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/verification:
    get:
      operationId: getVerificationSummary
      tags: [verification]
      summary: Заголовок верификации — статусы, счётчики, условия финализации, версии протокола
      description: |
        `status` — статус процесса (ТЗ §9.1), `verification_status` — статус текущей версии протокола (ТЗ §9.3).
        `gate` — условия финализации (п. 9.3.4): блокирующие (необработанные кандидаты, открытые споры, верификация
        не завершена) и предупреждения. Уровень риска влияет только на очерёдность (п. 9.2).
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
      responses:
        '200':
          description: Состояние верификации
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/findings:
    get:
      operationId: listVerificationQueue
      tags: [verification]
      summary: Очередь атомарных находок (кандидатов) для решения инспектора
      description: Порядок устойчивый — критичность, приоритет, карточка, местоположение; вкладка лишь фильтрует.
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - name: tab
          in: query
          schema: {$ref: '#/components/schemas/QueueTabCode'}
      responses:
        '200':
          description: Очередь
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationQueue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/findings/{finding_id}:
    get:
      operationId: getEvidenceCard
      tags: [verification]
      summary: Карточка доказательств атомарной находки (все поля п. 9.2.4 ТЗ)
      description: |
        Ожидаемое и фактическое значения, источники (file_id, SHA-256, стадия, шифр, редакция, статус утверждения,
        лист/страница, bbox), обоснование, уровень риска, решение инспектора и причина, история решений, спор с ИИ,
        подсказки комментариев. `evidence_card` и `finding_group` — формы контракта протокола для просмотрщика.
        `ETag` — row_version для If-Match; `evidence_fingerprint` передаётся в решении как `seen_fingerprint`.
      x-owner: AG-05
      x-permission: evidence.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/FindingIdPath'
      responses:
        '200':
          description: Карточка
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceCardView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/findings/{finding_id}/history:
    get:
      operationId: getFindingHistory
      tags: [verification]
      summary: История решений и споров по находке (записи только добавляются)
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/FindingIdPath'
      responses:
        '200':
          description: История
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FindingHistory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/findings/{finding_id}/decisions:
    post:
      operationId: decideFinding
      tags: [verification]
      summary: Решение инспектора — подтвердить, отклонить (с кодом причины), запросить уточнение, отменить
      description: |
        Одно решение по одной атомарной находке (п. 9.3.2 ТЗ; статуса PARTIALLY_CONFIRMED нет — 422
        STATUS_NOT_ALLOWED, разделите кандидата). `decision`: CONFIRMED_VIOLATION | NEGATIVE_VERIFIED |
        CLARIFICATION_REQUIRED | REVERT_TO_PENDING (синонимы v1.0: CONFIRMED, REJECTED). Отклонение требует
        только `reason_code`; комментарий и дополнительные поля необязательны (в том числе для OTHER).
        При отклонении ИИ проверяет причину: согласен / не уверен →
        NEGATIVE_VERIFIED и запись в Rejection_Log; не согласен → CLARIFICATION_REQUIRED, запись в Dispute_Log и
        системный комментарий п. 9.4 до повторного решения. Журнал аудита — действие фактического решения
        (FINDING_CONFIRMED | FINDING_REJECTED | FINDING_CLARIFICATION_REQUESTED | FINDING_DECISION_REVERTED |
        DECISION_OVERRIDE). В ответе — `next_finding_id` для автоперехода.
      x-owner: AG-05
      x-permission: finding.decide
      x-audit-action: FINDING_CONFIRMED
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, EVIDENCE_CHANGED, FINDING_LOCKED_BY_RECHECK, VERIFICATION_NOT_ALLOWED_IN_STATUS, REASON_CODE_REQUIRED, COMMENT_REQUIRED, STATUS_NOT_ALLOWED, PROTOCOL_FINALIZED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/FindingIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '201':
          description: Решение записано
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '423': {$ref: '#/components/responses/Locked'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/findings/{finding_id}/decisions/validate:
    post:
      operationId: validateDecision
      tags: [verification]
      summary: Проверка решения без записи — вердикт ИИ и предупреждения
      x-owner: AG-05
      x-permission: finding.decide
      x-audit-action: HTTP_POST
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, REASON_CODE_REQUIRED, COMMENT_REQUIRED, STATUS_NOT_ALLOWED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/FindingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: Результат проверки
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionValidation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/disputes:
    get:
      operationId: listDisputes
      tags: [verification]
      summary: Спорные случаи (Dispute_Log, ТЗ §10 табл. 7)
      x-owner: AG-05
      x-permission: protocol.read
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, UNAUTHENTICATED, SESSION_EXPIRED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
      responses:
        '200':
          description: Споры
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DisputeList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /disputes/{dispute_id}/resolve:
    post:
      operationId: resolveDispute
      tags: [verification]
      summary: Повторное решение по спору с ИИ
      description: |
        «Настоять на отклонении» (INSPECTOR_UPHELD, нужен собственный комментарий) → NEGATIVE_VERIFIED;
        «Подтвердить нарушение» (AI_UPHELD) → CONFIRMED_VIOLATION; «Оставить на уточнении» (KEPT_CLARIFICATION) →
        CLARIFICATION_REQUIRED — явный перенос по п. 9.3.4. If-Match — row_version находки.
      x-owner: AG-05
      x-permission: finding.decide
      x-audit-action: FINDING_REJECTED
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, EVIDENCE_CHANGED, VERIFICATION_NOT_ALLOWED_IN_STATUS, COMMENT_REQUIRED, PROTOCOL_FINALIZED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/DisputeIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisputeResolveRequest'}
      responses:
        '200':
          description: Спор разрешён, решение записано
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '423': {$ref: '#/components/responses/Locked'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/verification/claim:
    post:
      operationId: claimVerification
      tags: [verification]
      summary: Взять протокол в работу (READY → VERIFYING, назначение инспектора)
      x-owner: AG-05
      x-permission: finding.decide
      x-audit-action: HTTP_POST
      x-error-codes: [VALIDATION_ERROR, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, VERIFICATION_NOT_ALLOWED_IN_STATUS, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Статус процесса после перехода
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessTransition'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/verification/reopen:
    post:
      operationId: reopenVerification
      tags: [verification]
      summary: Возобновить верификацию (COMPLETED → VERIFYING) для изменения решения до финализации
      x-owner: AG-05
      x-permission: finding.decide
      x-audit-action: HTTP_POST
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, VERIFICATION_NOT_ALLOWED_IN_STATUS, PROTOCOL_FINALIZED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReopenRequest'}
      responses:
        '200':
          description: Статус процесса после перехода
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            ETag: {$ref: '#/components/headers/RowVersionETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessTransition'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VerificationConflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '423': {$ref: '#/components/responses/Locked'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /processes/{process_id}/finalize:
    post:
      operationId: finalizeProtocol
      tags: [verification]
      summary: Финализация протокола (подтверждение паролем, окончательная версия, черновики GOLD)
      description: |
        Условия (п. 9.3.4 ТЗ): каждый кандидат обработан или явно переведён в CLARIFICATION_REQUIRED, открытых
        споров нет, верификация завершена — иначе 409 FINALIZE_GATE_BLOCKED с перечнем блокирующих карточек.
        `reauth_token` из POST /auth/reauth (простая ЭП решения инспектора). Создаётся окончательная версия
        протокола N+1 (PROTOCOL_FINALIZED, решения применены, печать SHA-256), предыдущая — SUPERSEDED; из финальных
        решений CONFIRMED/NEGATIVE создаются черновики Dataset_Items. После финализации изменения — 423.
      x-owner: AG-05
      x-permission: protocol.finalize
      x-audit-action: PROTOCOL_FINALIZED
      x-error-codes: [VALIDATION_ERROR, MALFORMED_JSON, UNSUPPORTED_MEDIA_TYPE, PROCESS_NOT_FOUND, NOT_FOUND, HIDDEN_TEST_ACCESS_DENIED, PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT, FINALIZE_GATE_BLOCKED, PROTOCOL_FINALIZED, REAUTH_REQUIRED, CONTRACT_VALIDATION_FAILED, UNAUTHENTICATED, SESSION_EXPIRED, CSRF_TOKEN_INVALID, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, SESSION_STORE_UNAVAILABLE, DB_UNAVAILABLE, INTERNAL_ERROR]
      parameters:
        - $ref: '#/components/parameters/ProcessIdPath'
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinalizeRequest'}
      responses:
        '200':
