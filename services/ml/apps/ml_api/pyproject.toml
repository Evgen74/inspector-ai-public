[project]
name = "inspector-ml-api"
version = "0.1.0"
description = "Инспектор ИИ: internal ml-api (FastAPI, localhost only) — PDF page rendering and tiles for the evidence viewer (owner AG-00)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspector-common",
    "inspector-registry",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.28,<1.29",
    "numpy>=2.0",
]

[project.scripts]
inspector-ml-api = "inspector_ml_api.cli:main"

[tool.uv.sources]
inspector-common = { workspace = true }
inspector-registry = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector_ml_api"]
