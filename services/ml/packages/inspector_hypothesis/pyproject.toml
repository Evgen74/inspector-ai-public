[project]
name = "inspector-hypothesis"
version = "0.1.0"
description = "Инспектор ИИ: free hypothesis search and FREE-* findings (owner AG-07)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspector-common",
    "numpy>=2.0",
    "rapidfuzz>=3.9",
    "tokenizers>=0.20",
    # onnxruntime and onnxruntime-gpu share one import name and must never be installed together: CPU/CoreML
    # build on macOS and Linux aarch64, the CUDA 12 build (also runs on the CPU without a GPU) on Linux x86_64
    # and Windows. Capped below 1.27: from 1.27 PyPI ships CUDA 13 (driver >= 580). The [cuda,cudnn] extras pull the NVIDIA runtime wheels, so no system CUDA toolkit is needed.
    "onnxruntime>=1.22; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    "onnxruntime-gpu[cuda,cudnn]>=1.22,<1.27; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'",
    "inspector-registry",
]

[tool.uv.sources]
inspector-common = { workspace = true }
inspector-registry = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector_hypothesis"]
