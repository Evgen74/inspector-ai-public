[project]
name = "inspector-compare"
version = "0.1.0"
description = "Инспектор ИИ: comparators, atomic split, anchor pages, submission exporter, Приложение 2 protocol (owner AG-04)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspector-common",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "shapely>=2.0",
    "rapidfuzz>=3.9",
    "python-docx>=1.1",
    "inspector-registry",
    "inspector-eval",
    "pymupdf>=1.28,<1.29",
    "pillow>=10.4",
]

[tool.uv.sources]
inspector-common = { workspace = true }
inspector-registry = { workspace = true }
inspector-eval = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector_compare"]
