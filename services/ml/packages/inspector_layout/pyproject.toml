[project]
name = "inspector-layout"
version = "0.1.0"
description = "Инспектор ИИ: drawings and layout — title blocks, QR, sheet↔page map, CAD layers, revision clouds, room index, tag grammar (owner AG-02B)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspector-common",
    "inspector-docproc",
]

[tool.uv.sources]
inspector-common = { workspace = true }
inspector-docproc = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector_layout"]
