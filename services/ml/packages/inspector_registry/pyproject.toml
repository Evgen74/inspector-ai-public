[project]
name = "inspector-registry"
version = "0.1.0"
description = "Инспектор ИИ: manifest registry, sha256 resolver, revisions, archives, completeness, scenario (owner AG-01)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspector-common",
    "pymupdf>=1.28,<1.29",
    "py7zr>=0.22",
    "libarchive-c>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "jsonschema>=4.23",
]

[tool.uv.sources]
inspector-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector_registry"]
