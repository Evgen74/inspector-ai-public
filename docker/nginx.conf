# «Инспектор ИИ» web container: the Vite build as static files, /api proxied to the api service.
# Same paths as the Vite dev server (apps/web/vite.config.ts): /api -> API, /metrics -> API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: the api address is re-resolved (no stale IP after `docker compose restart api`)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload limits of the API: 500 MiB per document, 5 GiB per package (+ 64 MiB multipart envelope, see
    # apps/api/src/modules/upload/multipart-parser.ts). The API enforces the exact limits and answers with a problem
    # document; nginx only has to let the body through.
    client_max_body_size 5300m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;            # no URI part: the original request URI is passed unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # large uploads stream straight to the API (no temp file in the container, no double wait)
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Prometheus scrape endpoint of the API (module 11), outside the /api prefix
    location = /metrics {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    # hashed build assets never change
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # single-page application: any other path is a client-side route
    location / {
        try_files $uri /index.html;
    }
}
